      - Risk scoring pipeline

      GenAI side:
      - A knowledge bank with retention playbooks and escalation procedures
      - An AI agent that customer success reps can ask:
        "This customer has declining usage and 3 recent tickets, what should I do?"

      Show how traditional data pipelines and GenAI can work together in one project.
    needs_project: false
    timeout: 600
