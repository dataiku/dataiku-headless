tests:
  # ══════════════════════════════════════════════════════════
  #  OPEN-ENDED SCENARIOS — real-world agent tasks
  #  No step-by-step instructions. The agent must figure out
  #  what to build and how. These simulate actual field work.
  #
  #  RUBRIC POLICY: commands that are core to the task are
  #  required:true. Verification checks confirm the actual
  #  deliverables exist on DSS, not just that the project was
  #  created. A "pass" means the project is usable.
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────
  # O1: Financial Services RAG + Agent Demo
  # ──────────────────────────────────────────────────────────
  - id: o1_finserv_rag_demo
    tier: 9
    category: demo-build
    prompt: |
      We need to build a demo for a financial services customer that shows off
      Dataiku's RAG and agentic capabilities.

      The customer is a mid-size bank interested in:
      - Answering compliance questions from their policy documents
      - Having an AI agent that can look up customer account info and answer questions

      Build a DSS project that demonstrates this. Use project key DEMO_FINSERV.
      Create realistic synthetic data, set up the knowledge bank, embedding pipeline,
      and agent. Make it look polished — this is for a customer demo.

      When you're done, show me what you built and how it all connects.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku knowledge create"
          required: true
        - pattern: "dku recipe create-embed"
          required: true
        - pattern: "dku agent create"
          required: true
        - pattern: "dku llm list"
          required: true
      verify:
        - command: "dku project get DEMO_FINSERV -o json"
          expect_status: 0
        - command: "dku dataset list -P DEMO_FINSERV -o json"
          expect_status: 0
        - command: "dku knowledge list -P DEMO_FINSERV -o json"
          expect_status: 0
        - command: "dku agent list -P DEMO_FINSERV -o json"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.2

  # ──────────────────────────────────────────────────────────
  # O2: Healthcare Data Pipeline
  # ──────────────────────────────────────────────────────────
  - id: o2_healthcare_pipeline
    tier: 9
    category: demo-build
    prompt: |
      A healthcare company wants to see how Dataiku handles their data pipeline.
      They have patient encounter data, diagnosis codes, and treatment records
      that need to be cleaned, joined, and aggregated for reporting.

      Build a working project in DSS (key: DEMO_HEALTH) that:
      - Ingests realistic synthetic healthcare data (NO real PHI obviously)
      - Cleans and standardizes the data
      - Joins encounters with diagnoses and treatments
      - Produces summary statistics by department and diagnosis category

      Prefer visual recipes (join, group) over Python when possible.
      Use Python only for custom cleaning logic that visual recipes can't handle.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create"
          required: true
      verify:
        - command: "dku dataset list -P DEMO_HEALTH -o json"
          expect_status: 0
        - command: "dku recipe list -P DEMO_HEALTH -o json"
          expect_status: 0
        - command: "dku flow graph -P DEMO_HEALTH"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.2

  # ──────────────────────────────────────────────────────────
  # O3: Retail Customer 360
  # ──────────────────────────────────────────────────────────
  - id: o3_retail_customer360
    tier: 9
    category: demo-build
    prompt: |
      A retail company wants a Customer 360 project in Dataiku. They want to
      understand their customers better by combining transaction data, web
      behavior, and support tickets into a unified customer profile.

      Build project DEMO_RETAIL that:
      - Has realistic synthetic datasets for transactions, web events, and support tickets
      - Creates a unified customer profile by joining all three sources
      - Computes customer value metrics (total spend, frequency, recency)
      - Segments customers into tiers (gold, silver, bronze)

      Use visual join/group recipes where possible. Document the project with
      wiki articles and set relevant project variables.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset (create|upload)"
          required: true
        - pattern: "dku recipe create"
          required: true
        - pattern: "dku wiki create"
          required: true
      verify:
        - command: "dku dataset list -P DEMO_RETAIL -o json"
          expect_status: 0
        - command: "dku recipe list -P DEMO_RETAIL -o json"
          expect_status: 0
        - command: "dku wiki list -P DEMO_RETAIL -o json"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.2

  # ──────────────────────────────────────────────────────────
  # O4: GenAI Content Moderation Pipeline
  # ──────────────────────────────────────────────────────────
  - id: o4_content_moderation
    tier: 9
    category: demo-build
    prompt: |
      A social media company wants to use Dataiku for AI-powered content
      moderation. They need a project that demonstrates:

      - Ingesting user-generated content (synthetic posts with some flagged content)
      - Using an LLM to classify content as safe/unsafe/needs_review
      - Evaluating the LLM's classification accuracy against human labels
      - Creating an agent that moderators can query about moderation policies

      Build this in DSS project DEMO_MODERATION. Use whatever GenAI features
      are available — knowledge banks, embedding recipes, LLM eval, agents.
      If some features aren't available via the CLI, note what's missing.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku llm list"
          required: true
      verify:
        - command: "dku project get DEMO_MODERATION -o json"
          expect_status: 0
        - command: "dku dataset list -P DEMO_MODERATION -o json"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.1

  # ──────────────────────────────────────────────────────────
  # O5: Investigate & Fix a Broken Project
  # ──────────────────────────────────────────────────────────
  - id: o5_investigate_broken
    tier: 9
    category: diagnostic
    prompt: |
      Something is wrong with the BENCH_PIPELINE3 project (or if it doesn't exist,
      check BENCH_PIPELINE or any BENCH_ project).

      Act as a DSS admin doing triage:
      1. Figure out what's in the project — datasets, recipes, scenarios, jobs
      2. Check if the flow is healthy (any broken connections, schema issues?)
      3. Look at recent job history — did anything fail?
      4. Read the recipe code — does it look correct?
      5. Check project variables and wiki for documentation

      Write up a diagnostic report: what's working, what's broken, what you'd fix.
    needs_project: false
    timeout: 300
    expect:
      commands:
        - pattern: "dku (project get|dataset list|recipe list)"
          required: true
        - pattern: "dku flow (graph|check)"
          required: true
        - pattern: "dku (job list|recipe get-code)"
          required: true
    rubric:
      command_correct: 1.0
      outcome_verified: 0.0
      efficiency: 0.3

  # ──────────────────────────────────────────────────────────
  # O6: Insurance Claims Processing
  # ──────────────────────────────────────────────────────────
  - id: o6_insurance_claims
    tier: 9
    category: demo-build
    prompt: |
      An insurance company wants to modernize their claims processing with AI.
      Build a Dataiku project (DEMO_INSURANCE) that shows:

      - Claims intake: structured claims data with policy info, claim type, amounts
      - Document processing: a dataset of claim descriptions that need to be
        embedded into a knowledge bank for similarity search
      - An AI agent that claims adjusters can ask questions like
        "Find similar claims to this one" or "What's our policy on water damage?"

      Make it realistic — include policy documents in the knowledge bank,
      multiple claim types (auto, home, health), and proper data relationships.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku knowledge create"
          required: true
        - pattern: "dku (recipe create-embed|agent create)"
          required: true
      verify:
        - command: "dku project get DEMO_INSURANCE -o json"
          expect_status: 0
        - command: "dku dataset list -P DEMO_INSURANCE -o json"
          expect_status: 0
        - command: "dku knowledge list -P DEMO_INSURANCE -o json"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.1

  # ──────────────────────────────────────────────────────────
  # O7: Instance Health Check
  # ──────────────────────────────────────────────────────────
  - id: o7_instance_health
    tier: 9
    category: admin
    prompt: |
      You're a Dataiku admin. Do a health check on this DSS instance:

      - How many projects exist? Any that look like test/benchmark leftovers?
      - What plugins are installed? Any outdated ones?
      - What code environments exist? Are they healthy?
      - What LLM connections are configured (both completion and embedding)?
      - What connections are available? Any SQL databases?
      - Any running webapps or active scenarios?

      Produce a structured instance health report with recommendations.
    needs_project: false
    timeout: 300
    expect:
      commands:
        - pattern: "dku project list"
          required: true
        - pattern: "dku plugin list"
          required: true
        - pattern: "dku code-env list"
          required: true
        - pattern: "dku connection list"
          required: true
        - pattern: "dku llm list"
          required: true
    rubric:
      command_correct: 1.0
      outcome_verified: 0.0
      efficiency: 0.3

  # ──────────────────────────────────────────────────────────
  # O8: Manufacturing Quality Control
  # ──────────────────────────────────────────────────────────
  - id: o8_manufacturing_qc
    tier: 9
    category: demo-build
    prompt: |
      A manufacturing company wants to use Dataiku for quality control analytics.
      Build project DEMO_MANUFACTURING that includes:

      - Sensor readings from production lines (temperature, pressure, vibration, speed)
      - Quality inspection results (pass/fail with defect codes)
      - A pipeline that joins sensors with inspections and identifies which
        sensor conditions correlate with defects
      - Summary statistics: defect rate by production line, shift, and product type

      The data should be realistic — 50+ rows of sensor data, 30+ inspection records.
      Use visual join/group recipes where possible; Python only for custom analytics.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create"
          required: true
      verify:
        - command: "dku dataset list -P DEMO_MANUFACTURING -o json"
          expect_status: 0
        - command: "dku recipe list -P DEMO_MANUFACTURING -o json"
          expect_status: 0
        - command: "dku flow graph -P DEMO_MANUFACTURING"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.2

  # ──────────────────────────────────────────────────────────
  # O9: Migrate a pandas script to Dataiku
  # ──────────────────────────────────────────────────────────
  - id: o9_migrate_pandas
    tier: 9
    category: migration
    prompt: |
      A data scientist has this Python script they run locally:

      ```python
      import pandas as pd

      # Load data
      sales = pd.read_csv("sales.csv")
      products = pd.read_csv("products.csv")

      # Clean
      sales = sales.dropna(subset=["amount"])
      sales["amount"] = sales["amount"].astype(float)

      # Enrich
      enriched = sales.merge(products, on="product_id", how="left")
      enriched["revenue"] = enriched["amount"] * enriched["quantity"]

      # Aggregate
      summary = enriched.groupby("category").agg(
          total_revenue=("revenue", "sum"),
          avg_order=("amount", "mean"),
          order_count=("amount", "count")
      ).reset_index()

      summary.to_csv("summary.csv", index=False)
      ```

      Migrate this into a proper Dataiku project (DEMO_MIGRATION).
      Create the source datasets with synthetic data matching the expected schema,
      then recreate each step as a separate recipe in the DSS flow.

      IMPORTANT: Use visual recipes where possible:
      - The merge → use a Join recipe (create-join)
      - The groupby → use a Group recipe (create-group)
      - Python recipe only for the cleaning step and computed columns
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create.*UploadedFiles"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create"
          required: true
      verify:
        - command: "dku recipe list -P DEMO_MIGRATION -o json"
          expect_status: 0
        - command: "dku flow graph -P DEMO_MIGRATION"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3

  # ──────────────────────────────────────────────────────────
