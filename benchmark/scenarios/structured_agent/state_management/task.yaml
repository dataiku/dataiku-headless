id: state_management
domain: structured_agent
difficulty: hard
expected_gap: none
fixtures: []
setup: []
prompt: |
  Build an assistant named `stateful_agent` in project {project} that can
  remember information as it processes a request. It should be able to generate
  a value, hold onto it, and then use that stored information in its final
  response.
checks:
  - run: dku agent list -P {project} -o json
    assert: output_contains
    contains: stateful_agent
  - run: dku agent-block get-graph $(dku agent list -P {project} -o json | jq -r '.[] | select(.name=="stateful_agent") | .id') -P {project} -o json
    assert: output_contains
    contains: outputKey
validation_gaps:
  - "Checks prove a state-writing block exists (outputKey present), but do not assert the specific state variable name (agent-chosen and not enforced)."
