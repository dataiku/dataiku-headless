id: multi_step_agent
domain: structured_agent
difficulty: hard
expected_gap: none
fixtures: []
setup: []
prompt: |
  Build an assistant named `multi_step_agent` in project {project} that
  remembers what was discussed during a conversation and can summarize it at
  the end. The assistant should be able to keep track of key points as the chat
  goes on and then produce a final summary using that context.
checks:
  - run: dku agent list -P {project} -o json
    assert: output_contains
    contains: multi_step_agent
  - run: dku agent-block get-graph $(dku agent list -P {project} -o json | jq -r '.[] | select(.name=="multi_step_agent") | .id') -P {project} -o json
    assert: output_contains
    contains: SET_STATE_ENTRIES
  - run: dku agent-block get-graph $(dku agent list -P {project} -o json | jq -r '.[] | select(.name=="multi_step_agent") | .id') -P {project} -o json
    assert: output_contains
    contains: summarize
