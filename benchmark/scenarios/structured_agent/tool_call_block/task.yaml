id: tool_call_block
domain: structured_agent
difficulty: hard
expected_gap: none
fixtures:
  - world/customers
setup:
  - dku dataset create customers --type UploadedFiles -P {project}
  - dku dataset upload customers {fixture_dir}/customers.csv -P {project}
prompt: |
  Build an assistant named `tool_agent` in project {project} that can look up
  customer information from the `customers` dataset before answering questions.
  Create a customer lookup tool named `customer_lookup`, connect it to the
  assistant, and make sure the assistant can query that data when it needs to
  answer.
checks:
  - run: dku agent-tool list -P {project} -o json
    assert: output_contains
    contains: customer_lookup
  - run: dku agent-block get-graph $(dku agent list -P {project} -o json | jq -r '.[] | select(.name=="tool_agent") | .id') -P {project} -o json
    assert: output_contains
    contains: CORE_LOOP
validation_gaps:
  - "Checks prove the tool exists and the agent has a tool-calling core loop, but do not assert the tool's output is wired into the loop (internal output-key name is agent-chosen and not enforced)."
