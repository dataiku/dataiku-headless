id: versioned_agent
domain: structured_agent
difficulty: medium
expected_gap: none
fixtures:
  - world/customers
setup:
  - dku dataset create customers --type UploadedFiles -P {project}
  - dku dataset upload customers {fixture_dir}/customers.csv -P {project}
  - dku agent create customer_assistant --type STRUCTURED_AGENT -P {project}
prompt: |
  In project {project}, iterate on the `customer_assistant` agent using version
  management. Start by creating a lookup tool named `customer_lookup` on the
  `customers` dataset, then
  manage the agent across versions: add the tool and set the system prompt in
  separate versioned updates, then make v2 the active version. Acceptance
  criteria: the agent has at least 2 distinct versions, v2 is active, and the
  tool is available in the active version's tool list.
checks:
  - run: dku agent list-versions $(dku agent list -P {project} -o json | jq -r '.[] | select(.name=="customer_assistant") | .id') -P {project} -o json
    assert: min_rows
    min: 2
  - run: dku agent get $(dku agent list -P {project} -o json | jq -r '.[] | select(.name=="customer_assistant") | .id') -P {project} -o json
    assert: output_contains
    contains: customer_lookup
  - run: dku agent-tool list -P {project} -o json
    assert: output_contains
    contains: customer_lookup
