tests:
  # ══════════════════════════════════════════════════════════
  #  TIER 10: ALTERYX MIGRATION SCENARIOS
  #  Agent must read a workflow spec and recreate it in DSS
  #  using visual recipes wherever possible.
  # ══════════════════════════════════════════════════════════

  - id: m_alt1_customer_segmentation
    tier: 10
    category: migration-alteryx
    tags: ["migration", "fixture", "alteryx"]
    prompt: |
      I'm migrating an Alteryx workflow to Dataiku. The workflow does customer
      segmentation based on RFM (Recency, Frequency, Monetary) scoring.

      The workflow spec is at: {fixture_dir}/workflow_spec.md
      The input data is at: {fixture_dir}/input.csv

      Read the workflow spec carefully, then recreate it in DSS project {project}:
      1. Upload the input data as a dataset
      2. Recreate each transformation step as a Dataiku recipe
      3. The final output should have columns: customer_id, name, rfm_score, segment, lifetime_value, at_risk

      IMPORTANT: Use visual recipes (join, group, filter, sort, window) wherever possible.
      Only use Python recipes for operations that have no visual recipe equivalent
      (e.g., custom scoring formulas).

      After building, verify the flow structure and check the output data looks right.
    needs_project: true
    timeout: 600
    fixtures:
      - path: alteryx/test1
        inject_as: filesystem
    expect:
      commands:
        - pattern: "dku dataset create.*UploadedFiles"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create"
          required: true
      verify:
        - command: "dku dataset list -P {project} -o json"
          expect_status: 0
        - command: "dku recipe list -P {project} -o json"
          expect_status: 0
          expect_min_rows: 2
        - command: "dku flow graph -P {project}"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.2
      visual_recipe_ratio: 0.8
