id: raw_to_output_pipeline
domain: end_to_end
difficulty: hard
expected_gap: none
fixtures:
  - world/orders
  - world/products
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
  - "dku dataset set-schema orders -P {project} --definition '[{\"name\":\"order_id\",\"type\":\"string\"},{\"name\":\"customer_id\",\"type\":\"string\"},{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"region\",\"type\":\"string\"},{\"name\":\"amount\",\"type\":\"double\"},{\"name\":\"date\",\"type\":\"string\"}]'"
initial_checks:
  - run: dku dataset schema final_sales_rollup -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  Build a reporting flow in project {project} that starts from the uploaded
  `orders` and `products` datasets and ends with a final dataset named
  `final_sales_rollup` with columns `region`, `category`, and `amount_sum`. The
  output should summarize total revenue by region and product category. Keep
  this in the visual flow.
checks:
  - run: dku dataset schema final_sales_rollup -P {project} -o json
    assert: output_contains
    contains: region
  - run: dku dataset schema final_sales_rollup -P {project} -o json
    assert: output_contains
    contains: category
  - run: dku dataset head final_sales_rollup -P {project} -n 5 -o json
    assert: min_rows
    min: 4
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [final_sales_rollup]

expected_outputs:
  final_sales_rollup:
    schema:
      - {name: region, type: string}
      - {name: category, type: string}
      - {name: amount_sum, type: double}
    row_count: 8
expected_flow:
  nodes:
    orders:
      type: source
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    products:
      type: source
      schema:
        - {name: product_id, type: string}
        - {name: name, type: string}
        - {name: category, type: string}
        - {name: unit_price, type: double}
    orders_enriched:
      type: intermediate
    final_sales_rollup:
      type: output
      schema:
        - {name: region, type: string}
        - {name: category, type: string}
        - {name: amount_sum, type: double}
  recipes:
    - type: Join
      inputs: [orders, products]
      outputs: [orders_enriched]
    - type: Grouping
      inputs: [orders_enriched]
      outputs: [final_sales_rollup]
  exact_recipe_count: true
