id: automate_and_trigger
domain: end_to_end
difficulty: hard
expected_gap: none
fixtures:
  - world/orders
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - "dku dataset set-schema orders -P {project} --definition '[{\"name\":\"order_id\",\"type\":\"string\"},{\"name\":\"customer_id\",\"type\":\"string\"},{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"region\",\"type\":\"string\"},{\"name\":\"amount\",\"type\":\"double\"},{\"name\":\"date\",\"type\":\"string\"}]'"
initial_checks:
  - run: dku dataset schema automated_revenue_by_region -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, build a flow that turns `orders` into an aggregated
  dataset named `automated_revenue_by_region` with columns `region` and
  `amount_sum` (the total order amount per region), then automate it with a
  scenario called `refresh_revenue_pipeline` that runs when `orders` changes.
checks:
  - run: dku dataset head automated_revenue_by_region -P {project} -n 5 -o json
    assert: min_rows
    min: 4
  - run: dku scenario get-definition refresh_revenue_pipeline -P {project} -o json
    assert: trigger_watches
    trigger_type: ds_modified
    dataset: orders
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [automated_revenue_by_region]

expected_outputs:
  automated_revenue_by_region:
    schema:
      - {name: region, type: string}
      - {name: amount_sum, type: double}
    row_count: 4
    data:
      - {region: East, amount_sum: 11262.18}
      - {region: North, amount_sum: 11133.51}
      - {region: South, amount_sum: 11574.7}
      - {region: West, amount_sum: 11575.9}
expected_flow:
  nodes:
    orders:
      type: source
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    automated_revenue_by_region:
      type: output
      schema:
        - {name: region, type: string}
        - {name: amount_sum, type: double}
  recipes:
    - type: Grouping
      inputs: [orders]
      outputs: [automated_revenue_by_region]
  exact_recipe_count: true
