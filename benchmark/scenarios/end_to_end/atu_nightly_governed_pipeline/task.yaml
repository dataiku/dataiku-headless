id: atu_nightly_governed_pipeline
domain: end_to_end
difficulty: hard
expected_gap: none
fixtures:
  - atu/contracts
  - atu/erp_postings
setup:
  - dku dataset create contracts --type UploadedFiles -P {project}
  - dku dataset create erp_postings --type UploadedFiles -P {project}
  - dku dataset upload contracts {fixture_dir}/contracts.csv -P {project}
  - dku dataset upload erp_postings {fixture_dir}/erp_postings.csv -P {project}
  - "dku dataset set-schema erp_postings -P {project} --definition '[{\"name\":\"transaction_id\",\"type\":\"string\"},{\"name\":\"supplier_id\",\"type\":\"string\"},{\"name\":\"contract_ref\",\"type\":\"string\"},{\"name\":\"cost_center\",\"type\":\"string\"},{\"name\":\"gl_account\",\"type\":\"string\"},{\"name\":\"posting_date\",\"type\":\"string\"},{\"name\":\"amount_eur\",\"type\":\"double\"},{\"name\":\"description\",\"type\":\"string\"}]'"
initial_checks:
  - run: dku scenario get-definition nightly_contract_eval -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  Finance wants a nightly-refreshed view of how much we are actually spending
  per IT supplier contract, enriched with each contract's status and end date,
  so they can spot money still going out against contracts that should have
  stopped (the classic "expired but still billed" case).

  In project {project}, build a flow off the `erp_postings` and `contracts`
  datasets that produces a dataset named `contract_savings` summarising the
  billed amount per contract alongside that contract's supplier, end date and
  active status. Keep it in the visual flow. Then automate it with a scenario
  named `nightly_contract_eval` that rebuilds `contract_savings` every night.

  Acceptance criteria: `contract_savings` is built with real data and carries
  the supplier and contract identifiers; the project stays on visual recipes;
  and the scenario rebuilds the dataset on a nightly schedule.
validation_gaps:
  - "The scenario's nightly trigger and its build step are enforced structurally.
    The scenario is not executed by the harness, so a successful scheduled run
    is not graded."
checks:
  - run: dku dataset schema contract_savings -P {project} -o json
    assert: output_contains
    contains: supplier_id
  - run: dku dataset schema contract_savings -P {project} -o json
    assert: output_contains
    contains: contract_ref
  - run: dku dataset head contract_savings -P {project} -n 5 -o json
    assert: min_rows
    min: 4
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku scenario get-definition nightly_contract_eval -P {project} -o json
    assert: output_contains
    contains: temporal
  - run: dku scenario get-definition nightly_contract_eval -P {project} -o json
    assert: output_contains
    contains: contract_savings
  - run: dku scenario get-definition nightly_contract_eval -P {project} -o json
    assert: output_contains
    contains: Daily
