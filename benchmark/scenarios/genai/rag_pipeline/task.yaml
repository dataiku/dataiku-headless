id: rag_pipeline
domain: genai
difficulty: hard
expected_gap: tool_gap
fixtures:
  - world/products
setup:
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
prompt: |
  In project {project}, set up the AI to be able to answer questions about our
  products. Put the `products` data into a knowledge base named `products_kb`
  and set up retrieval on top of it so the AI can search it.
validation_gaps:
  - Current automated validation proves KB creation and RAG object creation only.
  - The harness does not yet prove successful KB build, retrieval, or grounded RAG responses on the live instance.
checks:
  - run: dku knowledge list -P {project} -o json
    assert: output_contains
    contains: products_kb
  - run: dku rag list -P {project} -o json
    assert: min_rows
    min: 1
