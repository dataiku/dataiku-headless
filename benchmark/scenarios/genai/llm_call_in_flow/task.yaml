id: llm_call_in_flow
domain: genai
difficulty: hard
expected_gap: tool_gap
fixtures:
  - world/customers
setup:
  - dku dataset create customers --type UploadedFiles -P {project}
  - dku dataset upload customers {fixture_dir}/customers.csv -P {project}
  - dku dataset create customer_messages --type UploadedFiles -P {project}
prompt: |
  In project {project}, generate short outreach messages from the `customers`
  dataset and save the result to `customer_messages`. Create one `message`
  value per customer for a small sample.
validation_gaps:
  - Current automated validation proves the generated output dataset only.
  - The harness does not yet prove that the transformation is represented as a native DSS GenAI or prompt recipe.
checks:
  - run: dku dataset schema customer_messages -P {project} -o json
    assert: has_columns
    columns:
      - name
      - tier
      - message
  - run: dku dataset head customer_messages -P {project} -n 5 -o json
    assert: min_rows
    min: 3
