id: prompt_recipe_basic
domain: genai
difficulty: medium
expected_gap: none
fixtures:
  - world/products
setup:
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
initial_checks:
  - run: dku dataset schema product_summaries -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, use AI to generate a short summary of each product in
  the `products` dataset and save the results to a dataset named
  `product_summaries` with a `summary` column, one row per product.
validation_gaps:
  - Checks confirm a summary was generated and persisted per product, but do not
    judge summary content quality.
checks:
  - run: dku dataset schema product_summaries -P {project} -o json
    assert: has_columns
    columns:
      - summary
  - run: dku dataset head product_summaries -P {project} -n 5 -o json
    assert: min_rows
    min: 3
