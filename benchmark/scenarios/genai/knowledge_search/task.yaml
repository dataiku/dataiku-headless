id: knowledge_search
domain: genai
difficulty: medium
expected_gap: tool_gap
fixtures:
  - world/products
setup:
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
  - "dku dataset set-schema products -P {project} --definition '[{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"name\",\"type\":\"string\"},{\"name\":\"category\",\"type\":\"string\"},{\"name\":\"unit_price\",\"type\":\"double\"}]'"
  - "dku recipe create-embed embed_products --input products --output-kb product_kb --embedding-llm {embedding_llm} --embed-column category --metadata-col name --metadata-col product_id -P {project}"
  - dku knowledge build product_kb --wait -P {project}
prompt: |
  In project {project}, the `product_kb` knowledge bank has already been created
  and built from the `products` dataset. Search it for products in the
  `Hardware` category and check the results come back with product details.
validation_gaps:
  - "Search results structure depends on the embedding model and chunking strategy. Checks verify existence of results and the search term, not specific product names."
checks:
  - run: dku knowledge search product_kb --query "Hardware" -P {project} -o json
    assert: output_contains
    contains: Hardware
  - run: dku knowledge search product_kb --query "Hardware" -P {project} -o json
    assert: min_rows
    min: 1
