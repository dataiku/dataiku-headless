id: wpp_strategist_eval_harness
domain: genai
difficulty: hard
expected_gap: tool_gap
fixtures:
  - wpp/wpp_test_cases
setup:
  - dku dataset create wpp_test_cases --type UploadedFiles -P {project}
  - dku dataset upload wpp_test_cases {fixture_dir}/wpp_test_cases.csv -P {project}
  - dku agent create wpp_campaign_strategist --type STRUCTURED_AGENT -P {project}
initial_checks:
  - run: dku agent-review get wpp_strategist_review -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  As our strategists iterate on the `wpp_campaign_strategist` agent they need a
  repeatable way to check its quality before they trust its briefs. In project
  {project}, set up an evaluation harness for that agent: a review named
  `wpp_strategist_review`, linked to the agent, that judges it on the criteria
  that matter for campaign briefs — brand alignment, a justified channel mix,
  cited sources, the over-€5M governance flag, and staying in scope — and load it
  with the battery of representative test prompts in `wpp_test_cases` so the team
  can re-score the agent on every change.

  Acceptance criteria: the review exists, is linked to the agent, defines those
  quality criteria, and contains the imported battery of test cases.
validation_gaps:
  - "Tool gap: in production the test battery is generated by an LLM prompt recipe
    (`compute_wpp_tests_generated`). Creating a prompt / LLM-generation recipe is
    not expressible through the current CLI, so here the battery is supplied as a
    dataset (`wpp_test_cases`) and imported. The self-generation step is not built
    or graded."
  - "The review's criteria and test battery are defined but the review is not run;
    per-test trait scores and pass/fail results are not produced or graded."
checks:
  - run: dku agent-review get wpp_strategist_review -P {project} -o json
    assert: output_contains
    contains: BrandAlignment
  - run: dku agent-review get wpp_strategist_review -P {project} -o json
    assert: output_contains
    contains: GovernanceFlagged
  - run: dku agent-review list-tests wpp_strategist_review -P {project} -o json
    assert: min_rows
    min: 5
  - run: dku agent-review get wpp_strategist_review -P {project} -o json
    assert: output_contains
    contains: ChannelMixJustified
  - run: dku agent-review get wpp_strategist_review -P {project} -o json
    assert: output_contains
    contains: SourcesCited
