tests:
  # ══════════════════════════════════════════════════════════
  #  FIXTURE-BACKED PIPELINE SCENARIOS
  #  Use real fixture data instead of agent-generated synthetic
  #  data. Tests the full create -> upload -> recipe -> verify
  #  workflow with known-good data.
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────
  # FX1: Sales Analytics Pipeline (smoke test)
  # ──────────────────────────────────────────────────────────
  - id: fx_sales_pipeline
    tier: 6
    category: fixture-pipeline
    tags: ["smoke", "fixture"]
    prompt: |
      Build a sales analytics pipeline in project {project}.

      Data files are available at:
      - {fixture_dir}/orders.csv (50 rows of sales orders)
      - {fixture_dir}/customers.csv (20 customers)

      Steps:
      1. Upload both CSV files as datasets (use --type UploadedFiles)
      2. Join orders with customers on customer_id (create-join)
      3. Group by region to get total revenue and order count per region (create-group)
      4. Sort by total revenue descending (create-sort)
      5. Build the full pipeline with --auto-update-schema
      6. Verify the final output with `dku dataset head`

      Use visual recipes ONLY. Do NOT use Python for the join or aggregation.
    needs_project: true
    timeout: 300
    fixtures:
      - path: sales/test1
        files: [orders.csv, customers.csv]
        inject_as: filesystem
    expect:
      commands:
        - pattern: "dku dataset create.*UploadedFiles"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create-join"
          required: true
        - pattern: "dku recipe create-group"
          required: true
        - pattern: "dku recipe create-sort"
          required: true
      no_python_recipes: true
      verify:
        - command: "dku recipe list -P {project} -o json"
          expect_status: 0
          expect_min_rows: 3
        - command: "dku flow graph -P {project}"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3
      visual_recipe_ratio: 1.0

  # ──────────────────────────────────────────────────────────
  # FX2: Healthcare Data Pipeline
  # ──────────────────────────────────────────────────────────
  - id: fx_healthcare_pipeline
    tier: 6
    category: fixture-pipeline
    tags: ["fixture"]
    prompt: |
      Build a healthcare analytics pipeline in project {project}.

      Data files are available at:
      - {fixture_dir}/encounters.csv (100 patient encounters)
      - {fixture_dir}/diagnoses.csv (80 diagnosis records)
      - {fixture_dir}/treatments.csv (60 treatment records)

      Steps:
      1. Upload all three CSV files as datasets
      2. Join encounters with diagnoses on encounter_id (create-join)
      3. Join the result with treatments on encounter_id (create-join)
      4. Group by department to get patient count, avg treatment cost (create-group)
      5. Sort by patient count descending (create-sort)
      6. Build and verify

      Use visual recipes wherever possible. Python only for custom logic
      that visual recipes can't handle.
    needs_project: true
    timeout: 300
    fixtures:
      - path: healthcare/test1
        inject_as: filesystem
    expect:
      commands:
        - pattern: "dku dataset create.*UploadedFiles"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create-join"
          required: true
        - pattern: "dku recipe create-group"
          required: true
      verify:
        - command: "dku recipe list -P {project} -o json"
          expect_status: 0
          expect_min_rows: 3
        - command: "dku flow graph -P {project}"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3
      visual_recipe_ratio: 1.0
