id: foreign_dataset_flow
domain: cross_project
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
setup:
  - python3 -c "import os,dataikuapi; c=dataikuapi.DSSClient(os.environ['DKU_URL'],os.environ['DKU_API_KEY']); c.create_project('{project}_SRC','Source Data','admin')"
  - dku dataset create orders --type UploadedFiles -P {project}_SRC
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}_SRC
  - python3 -c "import os,dataikuapi; c=dataikuapi.DSSClient(os.environ['DKU_URL'],os.environ['DKU_API_KEY']); settings=c.get_project('{project}_SRC').get_settings(); settings.add_exposed_object('DATASET','orders','{project}'); settings.save()"
initial_checks:
  - run: dku dataset schema high_value_orders -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  Another project called {project}_SRC has an orders dataset that has been
  shared with your project {project}. Using that shared dataset as input,
  create a filtered output dataset named `high_value_orders` in project
  {project} that contains only orders where the amount is greater than 100.
checks:
  - run: dku dataset list -P {project} -o json
    assert: output_contains
    contains: "orders"
  - run: dku dataset schema high_value_orders -P {project} -o json
    assert: has_columns
    columns: [order_id, amount, region]
  - run: dku dataset head high_value_orders -P {project} -n 5 -o json
    assert: min_rows
    min: 5
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [high_value_orders]

expected_outputs:
  high_value_orders:
    schema:
      - {name: order_id, type: string}
      - {name: customer_id, type: string}
      - {name: product_id, type: string}
      - {name: region, type: string}
      - {name: amount, type: double}
      - {name: date, type: dateonly}
    row_count: 197
validation_gaps:
  - "Cannot prove the foreign dataset was used as recipe input vs a local copy"
