id: alteryx_rfm_pipeline
domain: migration
difficulty: medium
expected_gap: none
fixtures:
  - migration/rfm_customers

setup:
  - "dku dataset create migration_rfm_customers --type UploadedFiles -P {project}"
  - "dku dataset upload migration_rfm_customers {fixture_dir}/rfm_customers.csv -P {project}"

initial_checks:
  - run: "dku dataset schema rfm_output -P {project} -o json"
    assert: exit_code_nonzero

prompt: |
  I'm migrating an Alteryx workflow into Dataiku in project {project}. The
  input dataset `migration_rfm_customers` is already there with customer
  spending and recency metrics.

  I need an output dataset named `rfm_output` that segments customers for
  lifecycle marketing. Exclude customers with no orders, calculate an RFM score
  from recency, frequency, and monetary behavior, assign each customer to Gold,
  Silver, or Bronze, and add derived fields for `lifetime_value` and
  `at_risk`.

  Keep the work in the visual flow. The final dataset should include
  `customer_id`, `name`, `rfm_score`, `segment`, `lifetime_value`, and
  `at_risk`.

checks:
  - run: "dku recipe list -P {project} -o json"
    assert: min_rows
    min: 1
  - run: "dku dataset schema rfm_output -P {project} -o json"
    assert: has_columns
    columns: [customer_id, name, rfm_score, segment, lifetime_value, at_risk]
  - run: "dku dataset head rfm_output -P {project} -n 100 -o json"
    assert: min_rows
    min: 80
  - run: "dku recipe list -P {project} -o json"
    assert: no_python_recipes
  - run: "dku dataset list -P {project} -o json"
    assert: output_rows
    columns: [rfm_output]
  - run: "dku dataset schema rfm_output -P {project} -o json"
    assert: column_is_numeric
    column: rfm_score
  - run: "dku dataset schema rfm_output -P {project} -o json"
    assert: column_is_numeric
    column: lifetime_value

expected_outputs:
  rfm_output:
    schema:
      - {name: customer_id, type: string}
      - {name: name, type: string}
      - {name: rfm_score, type: double}
      - {name: segment, type: string}
      - {name: lifetime_value, type: double}
      - {name: at_risk, type: string}
    row_count: 90
expected_flow:
  nodes:
    migration_rfm_customers:
      type: source
    rfm_output:
      type: output
      schema:
        - {name: customer_id, type: string}
        - {name: name, type: string}
        - {name: rfm_score, type: double}
        - {name: segment, type: string}
        - {name: lifetime_value, type: double}
        - {name: at_risk, type: string}
  recipes:
    - type: Filter
      inputs: [migration_rfm_customers]
    - type: Formula
  exact_recipe_count: false
  exact_dataset_count: false
