tests:
  - id: t2_json_output
    tier: 2
    category: dataset
    prompt: "List all datasets in project {project} and give me the output as JSON."
    needs_project: true
    expect:
      commands:
        - pattern: "dku dataset list"
          required: true
          flags: ["-P {project}", "-o json"]
    rubric:
      command_correct: 1.0
      flags_correct: 1.0

  - id: t2_head_rows
    tier: 2
    category: dataset
    prompt: "Show me the first 3 rows of data from dataset 'customers' in project {project}."
    needs_project: true
    expect:
      commands:
        - pattern: "dku dataset head"
          required: true
          flags: ["-n 3", "-P {project}"]
      text_contains:
        - "customers"
    rubric:
      command_correct: 1.0
      flags_correct: 1.0

  - id: t2_quiet_mode
    tier: 2
    category: project
    prompt: "List all projects but suppress the decorative output — I only want the raw data, no headers or formatting."
    needs_project: false
    expect:
      commands:
        - pattern: "dku project list"
          required: true
          flags: ["--quiet"]
    rubric:
      command_correct: 1.0
      flags_correct: 1.0

  - id: t2_project_export
    tier: 2
    category: project
    prompt: "Export project {project} as a zip archive to /tmp/bench_export.zip."
    needs_project: true
    expect:
      commands:
        - pattern: "dku project export"
          required: true
          flags: ["-P {project}"]
      text_contains:
        - "/tmp/"
    rubric:
      command_correct: 1.0
      flags_correct: 1.0

  - id: t2_recipe_json
    tier: 2
    category: recipe
    prompt: "Get the full definition of recipe 'compute_features' in project {project} in JSON format."
    needs_project: true
    expect:
      commands:
        - pattern: "dku recipe get"
          required: true
          flags: ["-P {project}", "-o json"]
    rubric:
      command_correct: 1.0
      flags_correct: 1.0
