id: golden_query
domain: semantic_layer
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
  - world/products
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
  - "dku dataset set-schema orders -P {project} --definition '[{\"name\":\"order_id\",\"type\":\"string\"},{\"name\":\"customer_id\",\"type\":\"string\"},{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"region\",\"type\":\"string\"},{\"name\":\"amount\",\"type\":\"double\"},{\"name\":\"date\",\"type\":\"string\"}]'"
initial_checks:
  - run: dku semantic-model list-golden-queries sales_semantic_model -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  Build a data model named `sales_semantic_model` in project {project} over
  `orders` and `products`, and save a commonly-used query named
  `monthly product revenue` that answers how much revenue each product brings
  in per month.
checks:
  - run: dku semantic-model list-golden-queries sales_semantic_model -P {project} -o json
    assert: output_contains
    contains: monthly product revenue
  - run: dku semantic-model list-entities sales_semantic_model -P {project} -o json
    assert: output_contains
    contains: products
