tests:
  # ══════════════════════════════════════════════════════════
  #  TIER 10: PANDAS MIGRATION SCENARIOS
  #  Agent must read a pandas script and decompose it into
  #  visual recipe steps in the DSS flow.
  # ══════════════════════════════════════════════════════════

  - id: m_py1_etl_pipeline
    tier: 10
    category: migration-pandas
    tags: ["migration", "fixture", "pandas"]
    prompt: |
      A data scientist has a pandas ETL script they run locally. We need to
      migrate this into a proper Dataiku project so it runs as a managed flow.

      The script is at: {fixture_dir}/script.py
      The input data is at: {fixture_dir}/input.csv

      Read the script and understand what each step does, then recreate it
      in DSS project {project}:

      1. Upload the input data
      2. Map each pandas operation to the right Dataiku recipe type:
         - df.dropna() / df[df.col == val] -> Python recipe (cleaning)
         - df.groupby().agg() -> Group recipe (create-group)
         - df.sort_values() -> Sort recipe (create-sort)
         - df.merge() -> Join recipe (create-join) if applicable
         - df.drop_duplicates() -> Distinct recipe (create-distinct)
      3. Wire the recipes into a flow where each step is a separate recipe
      4. Build the full pipeline and verify the output

      CRITICAL: Only use Python recipes for steps that have NO visual recipe
      equivalent. The whole point of migration is to maximize visual recipes.
    needs_project: true
    timeout: 600
    fixtures:
      - path: pandas/test1
        inject_as: filesystem
    expect:
      commands:
        - pattern: "dku dataset create.*UploadedFiles"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create-(group|sort)"
          required: true
      verify:
        - command: "dku recipe list -P {project} -o json"
          expect_status: 0
          expect_min_rows: 2
        - command: "dku flow graph -P {project}"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3
      visual_recipe_ratio: 0.6
