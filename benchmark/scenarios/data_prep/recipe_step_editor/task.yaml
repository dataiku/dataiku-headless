id: recipe_step_editor
domain: data_prep
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - "dku dataset set-schema orders -P {project} --definition '[{\"name\":\"order_id\",\"type\":\"string\"},{\"name\":\"customer_id\",\"type\":\"string\"},{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"region\",\"type\":\"string\"},{\"name\":\"amount\",\"type\":\"double\"},{\"name\":\"date\",\"type\":\"string\"}]'"
prompt: |
  In project {project}, build a prepare recipe named `clean_orders` that
  transforms `orders` into a new dataset `cleaned_orders` with three
  transformations: rename `amount` to `revenue`, add a computed column
  `revenue_with_tax` equal to revenue multiplied by 1.2, and keep only rows
  where revenue is greater than 10. Build the output.
checks:
  - run: dku recipe list -P {project} -o json
    assert: output_contains
    contains: clean_orders
  - run: dku recipe list-steps clean_orders -P {project} -o json
    assert: min_rows
    min: 3
  - run: dku dataset list -P {project} -o json
    assert: output_contains
    contains: cleaned_orders
  - run: dku recipe run clean_orders -P {project} -w
    assert: exit_code_zero
