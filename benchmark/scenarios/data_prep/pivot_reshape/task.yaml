id: pivot_reshape
domain: data_prep
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
  - world/products
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
initial_checks:
  - run: dku dataset schema monthly_category_wide -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  Build a reporting dataset in project {project} called `monthly_category_wide`
  from `orders` and `products`. It should end up as one row per month with
  separate columns for product categories such as Hardware and Software. Keep
  this in the visual flow.
checks:
  - run: dku dataset schema monthly_category_wide -P {project} -o json
    assert: exit_code_zero
  - run: dku dataset head monthly_category_wide -P {project} -n 5 -o json
    assert: min_rows
    min: 3
  - run: dku dataset schema monthly_category_wide -P {project} -o json
    assert: output_contains
    contains: Hardware
  - run: dku dataset schema monthly_category_wide -P {project} -o json
    assert: output_contains
    contains: Software
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [monthly_category_wide]
validation_gaps:
  - "Value verification stays optional: the pivoted measure column names
     (e.g. Hardware_SUM_amount) are DSS-engine defaults the prompt does not
     mandate, so a correct pivot using different column names would not match
     expected_outputs.data."

expected_outputs:
  monthly_category_wide:
    schema:
      - {name: date, type: dateonly}
      - {name: Hardware_SUM_amount, type: double}
      - {name: Software_SUM_amount, type: double}
      - {name: Accessories_SUM_amount, type: double}
      - {name: Services_SUM_amount, type: double}
    row_count: 3
    data:
      - {date: "2024-01", Hardware_SUM_amount: 1213.83, Software_SUM_amount: 1245.78, Accessories_SUM_amount: 1028.7, Services_SUM_amount: 1107.72}
      - {date: "2024-02", Hardware_SUM_amount: 1039.4, Software_SUM_amount: 990.94, Accessories_SUM_amount: 800.09, Services_SUM_amount: 920.27}
      - {date: "2024-03", Hardware_SUM_amount: 1120.47, Software_SUM_amount: 1235.1, Accessories_SUM_amount: 1139.69, Services_SUM_amount: 1068.92}
expected_flow:
  nodes:
    orders:
      type: source
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    products:
      type: source
      schema:
        - {name: product_id, type: string}
        - {name: name, type: string}
        - {name: category, type: string}
        - {name: unit_price, type: double}
    orders_enriched:
      type: intermediate
    monthly_category_wide:
      type: output
      schema:
        - {name: date, type: dateonly}
        - {name: Hardware_SUM_amount, type: double}
        - {name: Software_SUM_amount, type: double}
        - {name: Accessories_SUM_amount, type: double}
        - {name: Services_SUM_amount, type: double}
  recipes:
    - type: Join
      inputs: [orders, products]
      outputs: [orders_enriched]
    - type: Pivot
      inputs: [orders_enriched]
      outputs: [monthly_category_wide]
  exact_recipe_count: true
