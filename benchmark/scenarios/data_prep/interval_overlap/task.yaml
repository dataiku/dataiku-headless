id: interval_overlap
domain: data_prep
difficulty: hard
expected_gap: none
fixtures:
  - world/room_bookings
setup:
  - dku dataset create room_bookings --type UploadedFiles -P {project}
  - dku dataset upload room_bookings {fixture_dir}/room_bookings.csv -P {project}
initial_checks:
  - run: dku dataset schema room_overlap_total -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, the `room_bookings` dataset tracks four rooms (Alpha,
  Beta, Gamma, Delta) through Occupied, Available, and Maintenance periods
  from January to June 2024. I need to know the total number of days that
  Room Alpha and Room Beta were simultaneously occupied within Q2 2024 (April
  1 through June 30). Create a dataset called `room_overlap_total` with a
  single column `overlap_days_sum` containing the answer. Keep everything in
  the visual flow — no code recipes.
checks:
  - run: dku dataset schema room_overlap_total -P {project} -o json
    assert: has_columns
    columns:
      - overlap_days_sum
  - run: dku dataset head room_overlap_total -P {project} -n 5 -o json
    assert: min_rows
    min: 1
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [room_overlap_total]
  - run: dku dataset schema room_overlap_total -P {project} -o json
    assert: column_is_numeric
    column: overlap_days_sum

expected_outputs:
  room_overlap_total:
    schema:
      - name: overlap_days_sum
        type: bigint
    row_count: 1
    data:
      - overlap_days_sum: 47
