id: distinct_categories
domain: data_prep
difficulty: easy
expected_gap: none
fixtures:
  - world/products
setup:
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
initial_checks:
  - run: dku dataset schema product_categories -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, figure out which product categories we sell. Create a
  dataset named `product_categories` that lists the distinct categories from
  the `products` dataset. Keep this in the visual flow.
checks:
  - run: dku dataset schema product_categories -P {project} -o json
    assert: has_columns
    columns:
      - category
  - run: dku dataset head product_categories -P {project} -n 10 -o json
    assert: min_rows
    min: 4
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [product_categories]

expected_outputs:
  product_categories:
    schema:
      - {name: category, type: string}
    row_count: 4
    data:
      - {category: Accessories}
      - {category: Hardware}
      - {category: Services}
      - {category: Software}

expected_flow:
  nodes:
    products:
      type: source
      schema:
        - {name: product_id, type: string}
        - {name: name, type: string}
        - {name: category, type: string}
        - {name: unit_price, type: double}
    product_categories:
      type: output
      schema:
        - {name: category, type: string}
  recipes:
    - type: Distinct
      inputs: [products]
      outputs: [product_categories]
  exact_recipe_count: true

validation_gaps:
  - "Checks confirm the output exists with 4 distinct categories, but does not
     verify the recipe is Distinct rather than Group — flow_shape with
     exact_recipe_count catches a quick Group workaround but a clever agent could
     use Group and rename the output column to 'category'."
