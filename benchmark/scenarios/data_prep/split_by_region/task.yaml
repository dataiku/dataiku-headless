id: split_by_region
domain: data_prep
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
initial_checks:
  - run: dku dataset schema orders_east -P {project} -o json
    assert: exit_code_nonzero
  - run: dku dataset schema orders_west -P {project} -o json
    assert: exit_code_nonzero
  - run: dku dataset schema orders_north -P {project} -o json
    assert: exit_code_nonzero
  - run: dku dataset schema orders_south -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, split the `orders` dataset into separate datasets by
  region. Create `orders_east`, `orders_west`, `orders_north`, and
  `orders_south`. Keep this in the visual flow.
checks:
  - run: dku dataset schema orders_east -P {project} -o json
    assert: has_columns
    columns:
      - order_id
      - customer_id
      - product_id
      - region
      - amount
      - date
  - run: dku dataset schema orders_west -P {project} -o json
    assert: has_columns
    columns:
      - order_id
      - customer_id
      - product_id
      - region
      - amount
      - date
  - run: dku dataset schema orders_north -P {project} -o json
    assert: has_columns
    columns:
      - order_id
      - customer_id
      - product_id
      - region
      - amount
      - date
  - run: dku dataset schema orders_south -P {project} -o json
    assert: has_columns
    columns:
      - order_id
      - customer_id
      - product_id
      - region
      - amount
      - date
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset head orders_east -P {project} -n 5 -o json
    assert: min_rows
    min: 1
  - run: dku dataset head orders_south -P {project} -n 5 -o json
    assert: min_rows
    min: 1
  - run: dku dataset head orders_north -P {project} -n 5 -o json
    assert: min_rows
    min: 1
  - run: dku dataset head orders_west -P {project} -n 5 -o json
    assert: min_rows
    min: 1

expected_flow:
  nodes:
    orders:
      type: source
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    orders_east:
      type: output
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    orders_west:
      type: output
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    orders_north:
      type: output
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
    orders_south:
      type: output
      schema:
        - {name: order_id, type: string}
        - {name: customer_id, type: string}
        - {name: product_id, type: string}
        - {name: region, type: string}
        - {name: amount, type: double}
        - {name: date, type: dateonly}
  recipes:
    - type: Split
      inputs: [orders]
      outputs: [orders_east, orders_west, orders_north, orders_south]
  exact_recipe_count: true

validation_gaps:
  - "Checks confirm all 4 output datasets exist with the right columns, but do
     not verify the split condition actually separates by region correctly — a
     split with a wrong condition would still produce datasets with the right
     schema."
