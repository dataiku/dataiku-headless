id: filter_and_sort
domain: data_prep
difficulty: easy
expected_gap: none
fixtures:
  - world/products
setup:
  - dku dataset create products --type UploadedFiles -P {project}
  - dku dataset upload products {fixture_dir}/products.csv -P {project}
initial_checks:
  - run: dku dataset schema hardware_products_sorted -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, create a dataset named `hardware_products_sorted` from
  `products` that keeps only hardware items and orders them by `unit_price`
  descending. Keep this in the visual flow.
checks:
  - run: dku dataset schema hardware_products_sorted -P {project} -o json
    assert: has_columns
    columns:
      - product_id
      - category
      - unit_price
  - run: dku dataset head hardware_products_sorted -P {project} -n 5 -o json
    assert: min_rows
    min: 5
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [hardware_products_sorted]
  - run: dku dataset schema hardware_products_sorted -P {project} -o json
    assert: column_is_numeric
    column: unit_price

expected_outputs:
  hardware_products_sorted:
    schema:
      - {name: product_id, type: string}
      - {name: name, type: string}
      - {name: category, type: string}
      - {name: unit_price, type: double}
    row_count: 13
    data:
      - {product_id: P049, name: "Product 049", category: Hardware, unit_price: 104.25}
      - {product_id: P045, name: "Product 045", category: Hardware, unit_price: 95.25}
expected_flow:
  nodes:
    products:
      type: source
      schema:
        - {name: product_id, type: string}
        - {name: name, type: string}
        - {name: category, type: string}
        - {name: unit_price, type: double}
    hardware_products_sorted:
      type: output
      schema:
        - {name: product_id, type: string}
        - {name: name, type: string}
        - {name: category, type: string}
        - {name: unit_price, type: double}
  recipes:
    - type: Filter
      inputs: [products]
      outputs: [hardware_products_sorted]
  exact_recipe_count: false
