tests:
  - id: t6_data_pipeline
    tier: 6
    category: e2e
    prompt: >
      Set up a simple data pipeline in project {project}:
      1. Create a managed dataset called 'bench_raw_sales'
      2. Create a Python recipe called 'compute_bench_clean_sales' with
         'bench_raw_sales' as input and 'bench_clean_sales' as output
      3. Check the flow graph to verify the pipeline structure

      Use the dku CLI for all operations.
    needs_project: true
    timeout: 300
    expect:
      commands:
        - pattern: "dku dataset create.*bench_raw_sales"
          required: true
        - pattern: "dku recipe create.*compute_bench_clean_sales"
          required: true
        - pattern: "dku flow graph"
          required: false
      verify:
        - command: "dku dataset list -P {project} -o json"
          expect_contains: "bench_raw_sales"
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3

  - id: t6_plugin_build_deploy
    tier: 6
    category: e2e
    prompt: >
      Create a new Dataiku plugin called 'bench-quality-checks' with:
      - One agent tool called 'check-nulls' that reports null counts per column
      - One custom recipe called 'clean-nulls' that removes rows with null values

      Then deploy this plugin to the current DSS instance using the dku CLI.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku plugin push"
          required: false
      text_contains:
        - "bench-quality-checks"
        - "check-nulls"
        - "clean-nulls"
    rubric:
      command_correct: 0.5
      skill_routing: 1.0
      efficiency: 0.2

  - id: t6_diagnostic_workflow
    tier: 6
    category: e2e
    prompt: >
      Investigate project {project}: I need you to list all scenarios,
      check the status of each one, and look for any that have failed
      recently. If you find failures, get the job logs. Give me a
      summary of what you find.
    needs_project: true
    timeout: 300
    expect:
      commands:
        - pattern: "dku scenario list"
          required: true
        - pattern: "dku scenario status"
          required: false
      text_contains:
        - "scenario"
    rubric:
      command_correct: 1.0
      efficiency: 0.3
