        - pattern: "dku scenario list"
          required: true
          flags: ["-P {project}"]
    rubric:
      command_correct: 1.0
      flags_correct: 1.0

  - id: t1_recipe_list
    tier: 1
    category: recipe
    prompt: "Show me all the recipes in project {project}."
    needs_project: true
    expect:
      commands:
        - pattern: "dku recipe list"
          required: true
          flags: ["-P {project}"]
    rubric:
      command_correct: 1.0
      flags_correct: 1.0

  - id: t1_whoami
    tier: 1
    category: auth
    prompt: "Who am I logged in as on this DSS instance? Show my user info."
    needs_project: false
    expect:
      commands:
        - pattern: "dku whoami"
          required: true
    rubric:
