        - pattern: "dku project create.*--description"
          required: true
        - pattern: "dku project set-metadata"
          required: true
        - pattern: "dku project get"
          required: true
        - pattern: "dku project set-variables"
          required: true
        - pattern: "dku wiki create"
          required: true
      verify:
        - command: "dku project get BENCH_PROJMETA -o json"
          expect_status: 0
        - command: "dku project variables -P BENCH_PROJMETA -o json"
          expect_contains: "analytics"
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3

  # ──────────────────────────────────────────────────────────
  # A19: Documentation-heavy project — wiki + library + variables
  # Tests: comprehensive project documentation workflow
  # ──────────────────────────────────────────────────────────
  - id: a19_documented_project
    tier: 7
    category: metadata
    prompt: |
      Create a well-documented DSS project called BENCH_DOCS with name
      "Well-Documented Project" and description "A showcase of DSS project
      documentation best practices."

      Build comprehensive documentation:

      1. WIKI ARTICLES (create 4):
         - "Project Overview": high-level description, objectives, stakeholders
         - "Data Dictionary": describe 3 fictional datasets with column definitions
         - "Pipeline Architecture": describe a 3-stage ETL pipeline
         - "Runbook": operational procedures, troubleshooting, contacts

      2. LIBRARY CODE: Write utility modules:
         - python/utils/__init__.py (empty)
         - python/utils/validators.py (3 validation functions: validate_email,
           validate_date, validate_amount — simple implementations)
         - python/config.py (CONFIG dict with project settings)

      3. VARIABLES: Set project variables:
         environment=production, data_owner=analytics_team,
         refresh_schedule=daily, alert_email=team@example.com,
         version=1.0, last_reviewed=2024-01-15

      4. DATASETS: Upload a small 'sample_data' dataset (5 rows) to make
         the project non-empty.

      5. Verify everything: list wiki articles, library files, variables,
         and datasets. Show the project details.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create.*--description"
          required: true
        - pattern: "dku wiki create"
          required: true
        - pattern: "dku library write"
          required: true
        - pattern: "dku library mkdir"
          required: false
        - pattern: "dku project set-variables"
          required: true
        - pattern: "dku dataset create"
          required: true
      verify:
        - command: "dku wiki list -P BENCH_DOCS -o json"
          expect_status: 0
        - command: "dku library list -P BENCH_DOCS -o json"
          expect_status: 0
        - command: "dku project variables -P BENCH_DOCS -o json"
          expect_contains: "analytics_team"
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3

  # ──────────────────────────────────────────────────────────
  # A20: Full project with description + wiki updates (tier 8)
  # Tests: end-to-end metadata-rich project, highest complexity
  # ──────────────────────────────────────────────────────────
  - id: a20_metadata_rich_project
    tier: 8
    category: metadata
    prompt: |
      Build a complete, polished DSS project BENCH_POLISHED with name
      "Customer Churn Analytics" and a professional description.

      This project should look like it was set up by an experienced
      data engineer — not a benchmark. Make it look real.

      1. PROJECT SETUP: Create with a meaningful description about
         customer churn prediction for a SaaS company.

      2. DATASETS (2): Upload realistic synthetic data:
         - 'customers' (15 rows): customer_id, name, plan, monthly_spend,
           tenure_months, support_tickets, last_login_days_ago
         - 'churn_events' (8 rows): event_id, customer_id, churn_date, reason

      3. RECIPES (2): Build a pipeline:
         - 'compute_churn_features': join customers + churn_events, compute
           churn_risk features → output 'churn_features'
         - 'compute_churn_summary': aggregate by plan type → output 'churn_summary'

      4. WIKI (3 articles):
         - "Project Overview" — business context, objectives, key stakeholders
         - "Data Sources" — where data comes from, refresh frequency, quality notes
         - "Model Documentation" — feature engineering approach, next steps

      5. LIBRARY: Write python/analytics/churn_utils.py with helper functions
         for churn score computation.

      6. VARIABLES: department=data_science, model_version=1.2,
         training_date=2024-06-15, target_metric=f1_score

      7. After building everything, update the project description to include
         a summary of what was built (e.g., "2 datasets, 2 recipes, 3 wiki articles").

      8. Show the complete project state: flow graph, datasets, recipes,
         wiki articles, variables, and project details.
    needs_project: false
    timeout: 600
    expect:
      commands:
        - pattern: "dku project create"
          required: true
        - pattern: "dku dataset create.*UploadedFiles"
          required: true
        - pattern: "dku dataset upload"
          required: true
        - pattern: "dku recipe create"
          required: true
        - pattern: "dku recipe set-code"
          required: true
        - pattern: "dku wiki create"
          required: true
        - pattern: "dku library write"
          required: true
        - pattern: "dku project set-variables"
          required: true
        - pattern: "dku project set-metadata"
          required: true
      verify:
        - command: "dku project get BENCH_POLISHED -o json"
          expect_status: 0
        - command: "dku wiki list -P BENCH_POLISHED -o json"
          expect_status: 0
        - command: "dku recipe list -P BENCH_POLISHED -o json"
          expect_status: 0
    rubric:
      command_correct: 1.0
      outcome_verified: 1.0
      efficiency: 0.3
