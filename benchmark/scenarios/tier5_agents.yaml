tests:
  - id: t5_explore_project
    tier: 5
    category: agent-delegation
    prompt: >
      Explore and document everything in project {project}. I want a
      comprehensive report of all datasets, recipes, scenarios, agents,
      and the flow structure. Produce a structured summary.
    needs_project: true
    timeout: 300
    expect:
      agent_spawned: "dss-explorer"
      commands:
        - pattern: "dku"
          required: true
    rubric:
      agent_delegation: 1.0
      command_correct: 0.5
      efficiency: 0.3

  - id: t5_design_tool
    tier: 5
    category: agent-delegation
    prompt: >
      Help me design a Dataiku agent tool that can query our PostgreSQL
      database, run an analysis query, and return the results formatted
      as a markdown table. I need the tool schema, description, and
      implementation plan.
    needs_project: false
    timeout: 300
    expect:
      agent_spawned: "tool-designer"
      text_contains:
        - "tool"
        - "schema"
    rubric:
      agent_delegation: 1.0
      efficiency: 0.3
