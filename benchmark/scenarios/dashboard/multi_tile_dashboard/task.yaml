id: multi_tile_dashboard
domain: dashboard
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - "dku dataset set-schema orders -P {project} --definition '[{\"name\":\"order_id\",\"type\":\"string\"},{\"name\":\"customer_id\",\"type\":\"string\"},{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"region\",\"type\":\"string\"},{\"name\":\"amount\",\"type\":\"double\"},{\"name\":\"date\",\"type\":\"string\"}]'"
prompt: |
  Put together an `Operations Dashboard` in project {project} for the `orders`
  data. Include a chart titled `Revenue by Region` and at least one table, and
  place both on the same dashboard.
checks:
  - run: dku dashboard list -P {project} -o json
    assert: output_contains
    contains: Operations Dashboard
  - run: dku dashboard get-definition $(dku dashboard list -P {project} -o json | jq -r '.[] | select(.name=="Operations Dashboard") | .id') -P {project} -o json
    assert: output_contains
    contains: tiles
  - run: dku dashboard get-definition $(dku dashboard list -P {project} -o json | jq -r '.[] | select(.name=="Operations Dashboard") | .id') -P {project} -o json
    assert: output_contains
    contains: Revenue by Region
