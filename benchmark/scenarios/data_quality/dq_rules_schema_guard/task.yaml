id: dq_rules_schema_guard
domain: data_quality
difficulty: medium
expected_gap: none
fixtures:
  - world/orders
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
prompt: |
  In project {project}, the `orders` dataset has already been uploaded. Add
  three data quality rules to it: the dataset must have exactly 6 columns,
  `order_id` must never be blank, and `amount` must never be blank. Then run
  the rules to verify they all pass against the current data. Acceptance
  criteria: three rules are configured, all rules pass when executed.
checks:
  - run: dku dq list orders -P {project} -o json
    assert: min_rows
    min: 3
  - run: dku dq compute orders -P {project}
    assert: exit_code_zero
  - run: dku dq list orders -P {project} -o json
    assert: output_contains
    contains: "order_id"
  - run: dku dq list orders -P {project} -o json
    assert: output_contains
    contains: "amount"

validation_gaps:
  - "Checks confirm rules exist and pass on current data, but do not verify rules
    would actually fail on a broken schema — that would require injecting bad data
    (e.g. extra columns, blank order_id values) and re-running."
