id: column_rename_fix
domain: data_quality
difficulty: hard
expected_gap: none
fixtures:
  - world/orders
setup:
  - python3 -c "import csv; rows=list(csv.DictReader(open('{fixture_dir}/orders.csv'))); fns=['quantity_available' if h=='amount' else h for h in rows[0].keys()]; w=csv.DictWriter(open('/tmp/inventory_v2.csv','w',newline=''),fns); w.writeheader(); [w.writerow({('quantity_available' if k=='amount' else k):v for k,v in r.items()}) for r in rows]"
  - dku dataset create inventory --type UploadedFiles -P {project}
  - dku dataset upload inventory /tmp/inventory_v2.csv -P {project}
  - "dku dataset set-schema inventory -P {project} --definition '[{\"name\":\"order_id\",\"type\":\"string\"},{\"name\":\"customer_id\",\"type\":\"string\"},{\"name\":\"product_id\",\"type\":\"string\"},{\"name\":\"region\",\"type\":\"string\"},{\"name\":\"quantity_available\",\"type\":\"double\"},{\"name\":\"date\",\"type\":\"string\"}]'"
  - dku recipe create-filter inventory_cleaned -i inventory --output-ds inventory_cleaned --filter-formula "amount > 0" -P {project}
initial_checks:
  - run: dku dataset schema inventory -P {project} -o json
    assert: output_contains
    contains: "quantity_available"
prompt: |
  In project {project}, the upstream system renamed a column in the `inventory`
  dataset over the weekend. A downstream filter recipe `inventory_cleaned` was
  written against the old column name and is now broken. Find what is broken,
  fix the recipe so it reflects the new column name, and build the output so it
  is correct.
checks:
  - run: dku dataset head inventory_cleaned -P {project} -n 5 -o json
    assert: min_rows
    min: 5
  - run: dku dataset schema inventory_cleaned -P {project} -o json
    assert: has_columns
    columns: [order_id, quantity_available, region]
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dataset list -P {project} -o json
    assert: output_rows
    columns: [inventory_cleaned]

expected_outputs:
  inventory_cleaned:
    schema:
      - {name: order_id, type: string}
      - {name: customer_id, type: string}
      - {name: product_id, type: string}
      - {name: region, type: string}
      - {name: quantity_available, type: double}
      - {name: date, type: dateonly}
    row_count: 500
validation_gaps:
  - "Recipe may have been deleted and recreated instead of updated — both paths satisfy the checks"
