id: scenario_fail_fast
domain: data_quality
difficulty: hard
expected_gap: none
fixtures:
  - world/orders
setup:
  - dku dataset create orders --type UploadedFiles -P {project}
  - dku dataset upload orders {fixture_dir}/orders.csv -P {project}
  - dku dq create orders -P {project} --type not-empty --column order_id --name "order_id not blank"
initial_checks:
  - run: dku scenario get-definition nightly_pipeline -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, the `orders` dataset has data quality rules already
  configured. Build a nightly automation named `nightly_pipeline` that builds
  `orders` (which validates its quality rules automatically), then stops with an
  alert to `ops@example.com` if quality failed, or sends a completion notice to
  `team@example.com` if everything passed.
checks:
  - run: dku scenario get-definition nightly_pipeline -P {project} -o json
    assert: exit_code_zero
  - run: dku scenario get-definition nightly_pipeline -P {project} -o json
    assert: reporter_sends_email
    reporter_type: mail-scenario
    email: ops@example.com
  - run: dku scenario get-definition nightly_pipeline -P {project} -o json
    assert: reporter_sends_email
    reporter_type: mail-scenario
    email: team@example.com
validation_gaps:
  - "Checks verify scenario wiring but cannot prove the scenario actually halts
    on DQ failure without running it against deliberately bad data."
  - "Cannot verify that reporter conditions (success vs failure branching) are
    correctly inverted — both email addresses could be wired to the same
    condition and the checks would still pass."
