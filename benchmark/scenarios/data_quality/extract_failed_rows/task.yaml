id: extract_failed_rows
domain: data_quality
difficulty: medium
expected_gap: none
fixtures:
  - world/customers
setup:
  - dku dataset create customers --type UploadedFiles -P {project}
  - dku dataset upload customers {fixture_dir}/customers.csv -P {project}
initial_checks:
  - run: dku dataset schema failed_customers -P {project} -o json
    assert: exit_code_nonzero
prompt: |
  In project {project}, some `customers` records have a missing `customer_id`.
  First, add a data quality rule to check that `customer_id` is never empty.
  Run the rule to confirm which rows fail. Then create a filter recipe that
  extracts the failing rows into a dataset called `failed_customers`.
  Keep the filter in the visual flow.
checks:
  - run: dku dq list customers -P {project} -o json
    assert: min_rows
    min: 1
  - run: dku dq compute customers -P {project}
    assert: exit_code_zero
  - run: dku dataset schema failed_customers -P {project} -o json
    assert: has_columns
    columns:
      - name
      - tier
      - country
  - run: dku dataset head failed_customers -P {project} -n 10 -o json
    assert: min_rows
    min: 4
  - run: dku recipe list -P {project} -o json
    assert: no_python_recipes
  - run: dku dq list customers -P {project} -o json
    assert: output_contains
    contains: "ColumnNotEmptyRule"

expected_flow:
  nodes:
    customers:
      type: source
      schema:
        - {name: customer_id, type: string}
        - {name: name, type: string}
        - {name: tier, type: string}
        - {name: country, type: string}
    failed_customers:
      type: output
      schema:
        - {name: name, type: string}
        - {name: tier, type: string}
        - {name: country, type: string}
  recipes:
    - type: Filter
      inputs: [customers]
      outputs: [failed_customers]
  exact_recipe_count: true

validation_gaps:
  - "The customers fixture has 4 rows with empty customer_id. Checks confirm
     at least 4 rows are extracted, but do not verify the DQ rule
     configuration (type, column) or the filter formula — the agent could use
     a different condition that happens to also produce 4 rows."
  - "This tests dataset DQ rules + filter extraction as a proxy for recipe
     output quality checks, which are not directly CLI-accessible."
