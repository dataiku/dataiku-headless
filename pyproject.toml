[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dku-cli"
dynamic = ["version"]
description = "Developer CLI for Dataiku DSS — kubectl for your DSS instance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Christiaan Burrett" }]
keywords = ["dataiku", "dss", "cli", "genai", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.15,<1",
    "rich>=13",
    "dataiku-api-client>=14,<16",
    "keyring>=25",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "pre-commit>=4.5.1",
    "ruff>=0.15.7",
]

[project.scripts]
dku = "dku_cli.main:app"

[project.urls]
Homepage = "https://github.com/dataiku/dataiku-cli"
Repository = "https://github.com/dataiku/dataiku-cli"
Issues = "https://github.com/dataiku/dataiku-cli/issues"
Changelog = "https://github.com/dataiku/dataiku-cli/releases"

[dependency-groups]
dev = [
    "pydantic>=2.12.5",
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.version]
path = "src/dku_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dku_cli"]
