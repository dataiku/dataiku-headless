[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dku-headless"
version = "0.5.0"
description = "Dataiku Headless — the headless DSS control plane for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Dataiku" }]
keywords = ["dataiku", "dss", "cli", "genai", "mlops", "headless", "agent", "mcp", "code-mode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer==0.26.8",
    # click.core.UNSET (used by spec.py) is only importable on Click >= 8.3.
    "click==8.4.2",
    "rich>=13",
    "dataiku-api-client>=14.5,<16",
    "keyring>=25",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "typing-extensions>=4.1",
]

[project.scripts]
dku = "dku_cli.main:run"
dku-mcp = "dku_cli.mcp.cli:app"

[project.optional-dependencies]
# Runtime for the `dku-mcp serve` MCP server. Kept optional so the base CLI
# install stays lean.
mcp = ["fastmcp>=3,<4"]

[project.urls]
Homepage = "https://github.com/dataiku/dku-headless"
Repository = "https://github.com/dataiku/dku-headless"
Issues = "https://github.com/dataiku/dku-headless/issues"
Changelog = "https://github.com/dataiku/dku-headless/releases"

[dependency-groups]
dev = [
    "pydantic>=2.12.5",
    "pytest>=8",
    "pre-commit>=4.5.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.7",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]
[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "B008",
    # Ambiguous-unicode rules flag deliberate typography in user-facing help
    # text, output strings, and docstrings — en dashes ("READ – WRITE") and
    # multiplication signs ("3× faster"). "Fixing" them degrades the prose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--timeout=120"

[tool.hatch.build.targets.wheel]
packages = ["src/dku_cli"]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/dku_cli/__init__.py:__version__"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
build_command = "uv lock && make plugin"
assets = [
    ".claude-plugin/marketplace.json",
    "dataiku-mcp/.claude-plugin/plugin.json",
    "dataiku-mcp/.codex-plugin/plugin.json",
    "dataiku-mcp-bundle/manifest.json",
    "dataiku-mcp/wheels",
    "uv.lock",
]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.release]
match = "release/v.*"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
    '''chore(?:\([^)]*\))?: .+''',
    '''ci(?:\([^)]*\))?: .+''',
    '''refactor(?:\([^)]*\))?: .+''',
    '''style(?:\([^)]*\))?: .+''',
    '''test(?:\([^)]*\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
