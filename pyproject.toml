[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataiku-headless"
version = "1.0.0"
description = "Dataiku supervisor kit: a FastMCP server that lets an AI agent harness gather Dataiku DSS context, delegate building to Cobuild, and verify the result. The companion skill ships via the Claude Code / Codex / Cursor plugin, not this package."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dataiku" }]
keywords = ["dataiku", "dss", "mcp", "fastmcp", "agent", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastmcp",
    "dataiku-api-client>=14.7.0",
    "python-dotenv",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/dataiku/dku-headless"
Repository = "https://github.com/dataiku/dku-headless"

[project.scripts]
dataiku-mcp = "dataiku_mcp:run_server"
dataiku-headless = "cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dataiku_mcp", "cli"]

[tool.hatch.build.targets.sdist]
include = [
    "dataiku_mcp",
    "cli",
    "dataiku-skills",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
# Match the code style already in the tree (Ruff's 88-column default). Line
# length is not in the enforced rule set below, so this documents intent rather
# than gating; keep it aligned if the rule set ever adds E501.
line-length = 88

[tool.ruff.lint]
# Pin to Ruff's default rule set (pyflakes + a subset of pycodestyle) so the
# lint gate stays stable across Ruff upgrades. Import sorting is configured
# below but not yet enforced — add "I" to this list to opt in.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = false
annotated_tag = true
# Keep the plugin manifests' "version" field in lockstep with [project].version.
version_files = [
    ".claude-plugin/plugin.json",
    ".codex-plugin/plugin.json",
    ".cursor-plugin/plugin.json",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.3",
    "ruff>=0.15",
    "pytest>=8",
]
