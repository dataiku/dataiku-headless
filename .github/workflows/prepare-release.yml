name: Prepare release

# Manual dispatch creates a Commitizen-generated release PR. When that PR is
# merged, the push job tags the exact main commit; the existing tag-driven
# release workflows then publish it.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to prepare
        type: choice
        options:
          - stable
          - prerelease
        default: stable
        required: true
  push:
    branches: [main]
    paths:
      - pyproject.toml

concurrency:
  group: prepare-release-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Open release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Calculate next version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          args=(--get-next --yes)
          if [ "$CHANNEL" = "prerelease" ]; then
            args+=(--prerelease rc --prerelease-offset 1)
          fi
          version="$(uv run cz bump "${args[@]}")"
          branch="release/v${version}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Release branch $branch already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Generate Commitizen release commit
        env:
          CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "dataiku-release[bot]"
          git config user.email "dataiku-release[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          args=(--yes --check-consistency --no-verify)
          if [ "$CHANNEL" = "prerelease" ]; then
            args+=(--prerelease rc --prerelease-offset 1)
          fi
          uv run cz bump "${args[@]}"
          uv lock
          git add uv.lock
          git commit --amend --no-edit
          git push --set-upstream origin "$BRANCH"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): prepare v${VERSION}" \
            --body "Commitizen-generated ${CHANNEL} release. Merging this PR creates tag \`v${VERSION}\` and starts the protected publishing workflow."

  tag:
    name: Tag merged release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag new release version
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          git show "${BEFORE}:pyproject.toml" > "$RUNNER_TEMP/previous-pyproject.toml"
          previous="$(python3 -c 'import tomllib; print(tomllib.load(open("'"$RUNNER_TEMP"'/previous-pyproject.toml", "rb"))["project"]["version"])')"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$version" = "$previous" ]; then
            echo "Project version did not change; nothing to tag."
            exit 0
          fi
          if [ "$RELEASE_ENABLED" != "true" ]; then
            echo "::error::Releases are blocked. Set repository variable RELEASE_ENABLED=true to tag v${version}."
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(rc[1-9][0-9]*)?$'; then
            echo "::error::$version is not a stable or rc release version"
            exit 1
          fi
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git config user.name "dataiku-release[bot]"
          git config user.email "dataiku-release[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "$tag"
          git push origin "$tag"
