name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged to main, without the v prefix (for example, 0.4.0)
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Verify the committed MCP script lockfile
        run: uv lock --script bin/run_mcp.py --check
      - name: Verify the merged release version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *[!0-9.]*|*..*|.*|*.)
              echo "::error::Version must be a dotted numeric version without a v prefix."
              exit 1
              ;;
          esac

          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$project" != "$VERSION" ]; then
            echo "::error::main is at version $project, not requested version $VERSION. Merge the release PR first."
            exit 1
          fi

          manifests=(.claude-plugin/plugin.json .codex-plugin/plugin.json)
          if [ -f plugin.json ]; then
            manifests+=(plugin.json)
          fi
          for manifest in "${manifests[@]}"; do
            found=$(jq -r '.version' "$manifest")
            if [ "$found" != "$VERSION" ]; then
              echo "::error::$manifest is at $found, expected $VERSION."
              exit 1
            fi
          done

          entry=$(jq -r '.plugins[] | select(.name == "dataiku-headless") | .version // empty' \
            .claude-plugin/marketplace.json)
          if [ -n "$entry" ] && [ "$entry" != "$VERSION" ]; then
            echo "::error::marketplace.json is at $entry, expected $VERSION."
            exit 1
          fi

          if ! grep -Eq "^## v${VERSION//./\\.}( \\(|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for v$VERSION."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release tags
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          expected=$(git rev-parse HEAD)
          tags=("$TAG" "dataiku-headless--$TAG")
          refs=()
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tag in "${tags[@]}"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              target=$(git rev-list -n1 "$tag")
              if [ "$target" != "$expected" ]; then
                echo "::error::$tag points at $target, not main at $expected."
                exit 1
              fi
              echo "$tag already exists at main."
            else
              git tag -a "$tag" -m "dataiku-headless ${TAG#v}" HEAD
              refs+=("refs/tags/$tag")
            fi
          done

          if [ "${#refs[@]}" -gt 0 ]; then
            git push --atomic origin "${refs[@]}"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          awk -v version="$TAG" '
            /^## / { if (found) exit; if (index($0, version) == 4) found = 1 }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
