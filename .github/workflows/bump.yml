name: Bump version

# Commitizen drives versioning. On every push to main it reads the conventional
# commits since the last tag, bumps [project].version (and the plugin manifests
# in [tool.commitizen].version_files), updates CHANGELOG.md, commits the change,
# and creates the vX.Y.Z tag. That tag then triggers release.yml, which builds
# and publishes to PyPI. Pushes with no releasable commits (docs/chore/ci/...)
# are a no-op — see no_raise below.
#
# Two tags come out of a release, for two different audiences:
#   vX.Y.Z                     — commitizen's, consumed by release.yml
#   dataiku-headless--vX.Y.Z   — the plugin release, matching what
#                                `claude plugin tag` produces
# The plugin manifests' "version" field is what a harness compares to decide
# whether an installed plugin is out of date, so the steps below refuse to tag a
# release whose manifests did not actually move.
#
# Pre-releases are NOT cut here (a stable bump is derived from commits); tag a
# vX.Y.Z.preN pre-release by hand to drive pre-release.yml.
#
# Requires a RELEASE_PAT secret: a personal access token (or GitHub App token)
# with contents:write. The default GITHUB_TOKEN cannot be used here — refs it
# pushes do NOT start new workflow runs, so release.yml would never fire.
#
# TEMPORARY: bumping is blocked while the PR backlog is cleaned up. The job is
# gated on the repository variable RELEASE_ENABLED being 'true' (Settings >
# Secrets and variables > Actions > Variables), the same variable that gates
# release.yml and pre-release.yml. Unlike those two — which fail a `gate` job so
# a blocked release is loud — this one is a job-level `if`, so it *skips*: this
# workflow fires on every push to main, and failing each one would put a red X
# on every merge during exactly the cleanup it's meant to stay out of the way of.
# No bump means no tag, so nothing reaches release.yml either.
#
# TODO: once the open PR backlog is merged or closed and main is known good,
# drop the RELEASE_ENABLED clause from the `if` below (leaving the `bump:`
# loop guard), un-gate release.yml and pre-release.yml, and delete the variable.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version and tag
    runs-on: ubuntu-latest
    # Skip unless releases are enabled (see TEMPORARY note above), and never
    # re-run on the "bump: ..." commit commitizen just pushed, or it loops.
    if: ${{ vars.RELEASE_ENABLED == 'true' && !startsWith(github.event.head_commit.message, 'bump:') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PAT so the commit + tag push triggers release.yml (see header).
          token: ${{ secrets.RELEASE_PAT }}
      - name: Bump version, changelog and tag
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.RELEASE_PAT }}
          # 3 = no commits found, 21 = nothing to bump: treat both as a no-op
          # rather than a failed run.
          no_raise: "3,21"

      # commitizen rewrites the manifests through [tool.commitizen].version_files,
      # but a version_files entry whose version string no longer matches is
      # skipped *silently* — the run stays green while the plugin manifests keep
      # advertising the old version, which is exactly the field harnesses use to
      # decide whether users get an update. Fail loudly instead.
      - name: Verify plugin manifests carry the bumped version
        id: version
        run: |
          set -euo pipefail
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          claude=$(jq -r '.version' .claude-plugin/plugin.json)
          codex=$(jq -r '.version' .codex-plugin/plugin.json)

          for pair in "claude:${claude}" "codex:${codex}"; do
            name=${pair%%:*}
            found=${pair#*:}
            if [ "${found}" != "${project}" ]; then
              echo "::error::${name} manifest is at ${found}, expected ${project}." \
                   "Check that its version string is still matched by" \
                   "[tool.commitizen].version_files in pyproject.toml."
              exit 1
            fi
          done

          # The marketplace entry may restate the version; when it does, it wins
          # over plugin.json for users installing from the catalog, so the two
          # must agree. Absent is fine — plugin.json is then the only source.
          entry=$(jq -r '.plugins[] | select(.name == "dataiku-headless") | .version // empty' \
            .claude-plugin/marketplace.json)
          if [ -n "${entry}" ] && [ "${entry}" != "${project}" ]; then
            echo "::error::marketplace.json pins dataiku-headless at ${entry}, expected ${project}."
            exit 1
          fi

          echo "version=${project}" >> "${GITHUB_OUTPUT}"

      # Plugin release tag, in the form `claude plugin tag` expects. It is
      # separate from commitizen's vX.Y.Z tag (which drives release.yml) and
      # marks the commit harnesses resolve a plugin install to.
      - name: Tag the plugin release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="dataiku-headless--v${VERSION}"

          # No vX.Y.Z tag on HEAD means commitizen found nothing to release this
          # run (the no_raise no-op above), so there is no plugin release either.
          if [ -z "$(git tag --points-at HEAD --list "v${VERSION}")" ]; then
            echo "No v${VERSION} tag at HEAD — nothing was bumped; skipping ${tag}."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "dataiku-headless ${VERSION}"
          git push origin "refs/tags/${tag}"
