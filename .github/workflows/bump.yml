name: Bump version

# Commitizen drives versioning. On every push to main it reads the conventional
# commits since the last tag, bumps [project].version (and the plugin manifests
# in [tool.commitizen].version_files), updates CHANGELOG.md, commits the change,
# and creates the vX.Y.Z tag. That tag then triggers release.yml, which builds
# and publishes to PyPI. Pushes with no releasable commits (docs/chore/ci/...)
# are a no-op — see no_raise below.
#
# Pre-releases are NOT cut here (a stable bump is derived from commits); tag a
# vX.Y.Z.preN pre-release by hand to drive pre-release.yml.
#
# Requires a RELEASE_PAT secret: a personal access token (or GitHub App token)
# with contents:write. The default GITHUB_TOKEN cannot be used here — refs it
# pushes do NOT start new workflow runs, so release.yml would never fire.
#
# TEMPORARY: bumping is blocked while the PR backlog is cleaned up. The job is
# gated on the repository variable RELEASE_ENABLED being 'true' (Settings >
# Secrets and variables > Actions > Variables), the same variable that gates
# release.yml and pre-release.yml. Unlike those two — which fail a `gate` job so
# a blocked release is loud — this one is a job-level `if`, so it *skips*: this
# workflow fires on every push to main, and failing each one would put a red X
# on every merge during exactly the cleanup it's meant to stay out of the way of.
# No bump means no tag, so nothing reaches release.yml either.
#
# TODO: once the open PR backlog is merged or closed and main is known good,
# drop the RELEASE_ENABLED clause from the `if` below (leaving the `bump:`
# loop guard), un-gate release.yml and pre-release.yml, and delete the variable.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version and tag
    runs-on: ubuntu-latest
    # Skip unless releases are enabled (see TEMPORARY note above), and never
    # re-run on the "bump: ..." commit commitizen just pushed, or it loops.
    if: ${{ vars.RELEASE_ENABLED == 'true' && !startsWith(github.event.head_commit.message, 'bump:') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PAT so the commit + tag push triggers release.yml (see header).
          token: ${{ secrets.RELEASE_PAT }}
      - name: Bump version, changelog and tag
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.RELEASE_PAT }}
          # 3 = no commits found, 21 = nothing to bump: treat both as a no-op
          # rather than a failed run.
          no_raise: "3,21"
