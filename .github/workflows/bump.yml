name: Bump version

# Batch changes on main, then prepare a reviewed release PR with Commitizen.
# Publishing is a separate manual dispatch targeting that PR's merged commit.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a release PR or publish a merged release PR
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      release_pr:
        description: Merged release PR number (required for publish)
        type: string
        default: ''

concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check release baseline and outstanding PRs
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/check_release.py)
          git rev-parse --verify "refs/tags/v${version}"
          open=$(gh pr list --base main --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
          test "$open" = 0 || { echo 'Finish or close the existing release PR first.'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify PEP 723 script lockfile is current
        run: |
          set -euo pipefail
          uv lock --script runtime/run_mcp.py --check
          uv lock --script runtime/run_mcp.py --upgrade
          git diff --exit-code -- runtime/run_mcp.py.lock
      - name: Bump version and changelog locally
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: false
          no_raise: '3,21'
      - name: Validate the prepared version
        id: version
        env:
          PREVIOUS: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/check_release.py)
          if [ "$version" = "$PREVIOUS" ]; then
            echo 'No releasable commits.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv lock
          uv sync --locked
          python3 scripts/check_release.py --notes > "$RUNNER_TEMP/notes.md"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Open release PR
        if: steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit --amend --no-edit
          branch="release/$VERSION"
          # Never push Commitizen's local tag or update main directly.
          git push origin "HEAD:refs/heads/$branch"
          url=$(gh pr create --base main --head "$branch" --title "bump: release $VERSION" --body-file "$RUNNER_TEMP/notes.md")
          echo "Release PR: $url. Approve its workflows, review and merge, then dispatch publish with its PR number." >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Resolve merged release PR and check CI
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Provide a release PR number.'; exit 1; }
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -e --arg repo "$GH_REPO" '.merged == true and .base.ref == "main" and .head.repo.full_name == $repo and (.head.ref | test("^release/[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$RUNNER_TEMP/pr.json"
          sha=$(jq -r .merge_commit_sha "$RUNNER_TEMP/pr.json")
          version=$(jq -r '.head.ref | ltrimstr("release/")' "$RUNNER_TEMP/pr.json")
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" > "$RUNNER_TEMP/ci.json"
          jq -e '.workflow_runs[0] | .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ci.json"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify merged release before publishing
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          test "$(python3 scripts/check_release.py)" = "$VERSION"
          git merge-base --is-ancestor HEAD origin/main
          uv lock --check
          uv lock --script runtime/run_mcp.py --check
          python3 scripts/check_release.py --notes > "$RUNNER_TEMP/notes.md"
      - name: Push matching tags and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sha=$(git rev-parse HEAD)
          # Check BOTH existing tags before creating or pushing either one.
          for tag in "v$VERSION" "dataiku-headless--v$VERSION"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" || { echo "Tag $tag points to another commit."; exit 1; }
            fi
          done
          for tag in "v$VERSION" "dataiku-headless--v$VERSION"; do
            git show-ref --verify --quiet "refs/tags/$tag" || git tag -a "$tag" -m "dataiku-headless $VERSION"
          done
          git push --atomic origin "refs/tags/v$VERSION" "refs/tags/dataiku-headless--v$VERSION"
          # A successful retry leaves an existing release unchanged.
          gh release list --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          if ! jq -e --arg tag "v$VERSION" 'any(.[]; .tagName == $tag)' "$RUNNER_TEMP/releases.json"; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "v$VERSION" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
