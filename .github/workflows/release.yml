name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the built wheel to PyPI (dku-headless). Leave false to only build/release."
        type: boolean
        default: false
      ref:
        description: "Tag or ref to build when dispatching manually (e.g. v0.4.1)."
        type: string
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Require a ref for PyPI publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi && inputs.ref == '' }}
        run: |
          echo "Set the ref input to the release tag (for example v0.5.0) before publishing to PyPI." >&2
          exit 1

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Python Semantic Release
        if: github.event_name == 'push'
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release semantic-release -v version --no-vcs-release

      - name: Build CLI wheel
        run: uv build

      - name: Verify released wheel version
        if: github.event_name == 'push' && steps.semantic.outputs.released == 'true'
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          WHEEL_VERSION=$(basename "$WHEEL" | cut -d- -f2)
          EXPECTED="${{ steps.semantic.outputs.version }}"
          if [ "$WHEEL_VERSION" != "$EXPECTED" ]; then
            echo "Version mismatch: semantic-release=$EXPECTED wheel=$WHEEL_VERSION" >&2
            exit 1
          fi
          echo "Wheel version verified: $EXPECTED"

      - name: Verify dispatched wheel version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          WHEEL_VERSION=$(basename "$WHEEL" | cut -d- -f2)
          EXPECTED="${{ inputs.ref }}"
          EXPECTED="${EXPECTED#v}"
          if [ "$WHEEL_VERSION" != "$EXPECTED" ]; then
            echo "Version mismatch: ref=$EXPECTED wheel=$WHEEL_VERSION" >&2
            exit 1
          fi
          echo "Wheel version verified: $EXPECTED"

      - name: Build MCP plugin bundle
        run: make plugin

      - name: Build Claude Desktop .mcpb bundle
        run: make desktop-bundle

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'push' && steps.semantic.outputs.released == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ steps.semantic.outputs.tag }}
          make_latest: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dataiku-mcp-bundle/dist/dataiku-mcp.mcpb

      - name: Upload build artifacts (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (manual)
    needs: release
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dku-headless/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          print-hash: true
