name: Release

# Publishes a stable release after a reviewed release PR is merged and
# prepare-release.yml tags its exact main commit. Only final vX.Y.Z tags fire here;
# vX.Y.ZrcN tags are handled by pre-release.yml.

on:
  push:
    tags:
      # Final releases only: vMAJOR.MINOR.PATCH (e.g. v0.3.0).
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v0.3.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # TEMPORARY: releases are blocked while the PR backlog is being cleaned up.
  # Nothing publishes unless the repository variable RELEASE_ENABLED is set to
  # 'true' (Settings > Secrets and variables > Actions > Variables).
  #
  # TODO: once the open PR backlog is merged or closed and main is known good,
  # remove this `gate` job and the `needs: gate` on `publish` below, then drop
  # the RELEASE_ENABLED variable. Until then, flipping the variable to 'true' is
  # the escape hatch for a one-off release — no code change needed.
  gate:
    name: Check releases are enabled
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless RELEASE_ENABLED is true
        if: vars.RELEASE_ENABLED != 'true'
        run: |
          echo "::error::Releases are blocked. Set repository variable RELEASE_ENABLED=true to publish."
          exit 1

  publish:
    name: Build and publish to PyPI
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dataiku-headless
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Derive version from tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Stable vX.Y.Z only; reject rc tags outright.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a stable vX.Y.Z release tag"
            exit 1
          fi
          version="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing release ${version} (tag ${TAG})"
      - name: Stamp pyproject version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          patched, n = re.subn(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
          if n != 1:
              raise SystemExit(f"expected exactly one [project].version line, patched {n}")
          path.write_text(patched)
          print(f"Set pyproject version to {version}")
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test built wheel
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/dataiku-headless" --help >/dev/null
          "$RUNNER_TEMP/release-smoke/bin/python" -c "import cli, dataiku_mcp"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          skip-existing: true
      - name: Extract changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
          $0 == "## v" version || index($0, "## v" version " ") == 1 { found = 1 }
          found && /^## / && $0 != "## v" version && index($0, "## v" version " ") != 1 { exit }
          found { print }
          END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              dist/*
          fi
