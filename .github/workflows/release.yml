name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build when dispatching manually (e.g. v0.4.1)."
        type: string
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Resolve release metadata
        id: release
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG="v$VERSION"
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          publish=false
          if [ "${{ github.event_name }}" = "push" ] && { [ -z "$REMOTE_SHA" ] || [ "$REMOTE_SHA" = "$HEAD_SHA" ]; }; then
            publish=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Sync dependencies (locked)
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        run: uv sync --locked

      - name: Lint
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        run: uv run pytest -q -n auto

      - name: Build CLI wheel
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        run: uv build

      - name: Verify released wheel version
        if: github.event_name == 'push' && steps.release.outputs.publish == 'true'
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          WHEEL_VERSION=$(basename "$WHEEL" | cut -d- -f2)
          EXPECTED="${{ steps.release.outputs.version }}"
          if [ "$WHEEL_VERSION" != "$EXPECTED" ]; then
            echo "Version mismatch: release=$EXPECTED wheel=$WHEEL_VERSION" >&2
            exit 1
          fi
          echo "Wheel version verified: $EXPECTED"

      - name: Verify dispatched wheel version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          WHEEL_VERSION=$(basename "$WHEEL" | cut -d- -f2)
          EXPECTED="${{ inputs.ref }}"
          EXPECTED="${EXPECTED#v}"
          if [ "$WHEEL_VERSION" != "$EXPECTED" ]; then
            echo "Version mismatch: ref=$EXPECTED wheel=$WHEEL_VERSION" >&2
            exit 1
          fi
          echo "Wheel version verified: $EXPECTED"

      - name: Build MCP plugin bundle
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        run: make plugin

      - name: Build Claude Desktop .mcpb bundle
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        run: make desktop-bundle

      - name: Create release tag
        if: github.event_name == 'push' && steps.release.outputs.publish == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          if [ -n "$REMOTE_SHA" ]; then
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$REMOTE_SHA" = "$HEAD_SHA" ]; then
              echo "Tag $TAG already points at $HEAD_SHA"
              exit 0
            fi
            echo "Tag $TAG already exists at $REMOTE_SHA, not $HEAD_SHA" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Extract release notes
        if: github.event_name == 'push' && steps.release.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          awk -v version="$VERSION" '
          function is_heading(line) { return line ~ /^## / }
          function is_target(line) {
            return line ~ ("^## \\[" version "\\]") || line ~ ("^## v" version "([[:space:]]|$|\\()")
          }
          is_target($0) { found = 1; print; next }
          found && is_heading($0) { exit }
          found { print }
          END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'push' && steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          make_latest: true
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dataiku-mcp-bundle/dist/dataiku-mcp.mcpb

      - name: Upload build artifacts (dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*
            dataiku-mcp-bundle/dist/dataiku-mcp.mcpb
          if-no-files-found: error
