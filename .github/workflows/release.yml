name: Release

# Tagging a `v*` commit cuts a GitHub Release with the wheel + bundles attached.
# Publishing to PyPI is a SEPARATE, manually-gated job (see `publish-pypi`):
# it never runs on a plain tag push — a human dispatches it deliberately.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the built wheel to PyPI (dataiku-headless). Leave false to only build/release."
        type: boolean
        default: false
      ref:
        description: "Tag or ref to build when dispatching manually (e.g. v0.4.0)."
        type: string
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            REF="${{ github.event.inputs.ref }}"
            TAG_VERSION="${REF#v}"
          fi
          if [ -z "$TAG_VERSION" ]; then
            echo "No version could be resolved (dispatch without a ref?)." >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG_VERSION"

      - name: Verify __version__ matches the tag
        run: |
          SRC_VERSION=$(uv run python -c "import dku_cli; print(dku_cli.__version__)")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$SRC_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: src/dku_cli/__init__.py __version__=$SRC_VERSION but tag=$TAG_VERSION" >&2
            echo "Bump __version__ to match the tag (or tag the right commit) before releasing." >&2
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Build CLI wheel
        run: uv build

      - name: Verify wheel version matches tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          WHEEL=$(ls dist/*.whl | head -1)
          WHEEL_VERSION=$(basename "$WHEEL" | cut -d- -f2)
          if [ "$TAG_VERSION" != "$WHEEL_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION wheel=$WHEEL_VERSION" >&2
            exit 1
          fi
          echo "Wheel version verified: $TAG_VERSION"

      - name: Build MCP plugin bundle
        run: make plugin

      - name: Build Claude Desktop .mcpb bundle
        run: make desktop-bundle

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/*.whl dist/*.tar.gz release-artifacts/ 2>/dev/null || cp dist/*.whl release-artifacts/
          cp dataiku-mcp/wheels/*.whl release-artifacts/ 2>/dev/null || true
          cp dataiku-mcp-bundle/dist/dataiku-mcp.mcpb release-artifacts/
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dataiku-mcp-bundle/dist/dataiku-mcp.mcpb

  # Manually-gated PyPI publish. Does NOT run on a normal tag push: it requires
  # an explicit workflow_dispatch with publish_pypi=true AND lives behind the
  # `pypi` GitHub Environment (configure required reviewers there for a second
  # human gate). Uses OIDC trusted publishing — no API token in secrets.
  publish-pypi:
    name: Publish to PyPI (manual)
    needs: release
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dataiku-headless/
    permissions:
      id-token: write # OIDC for trusted publishing
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          print-hash: true
