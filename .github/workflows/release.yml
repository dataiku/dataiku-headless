name: Release

# Publishes a stable release of dataiku-headless to PyPI when a release
# tag is pushed. Cut a release by tagging a commit and pushing the tag:
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# (commitizen's `cz bump` creates this tag for you.) The pushed tag is the
# source of truth for the version: this workflow stamps `[project].version`
# in pyproject.toml from the tag before building. Only final vX.Y.Z tags fire
# here; pre-release vX.Y.Z.preN tags are handled by pre-release.yml.

on:
  push:
    tags:
      # Final releases only: vMAJOR.MINOR.PATCH (e.g. v0.3.0).
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Never fire on pre-release tags — pre-release.yml owns those. The
      # positive pattern above already excludes them (tag patterns match the
      # full ref, so the trailing `.preN` can't match); this makes it explicit.
      - '!v[0-9]+.[0-9]+.[0-9]+.pre[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v0.3.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # TEMPORARY: releases are blocked while the PR backlog is being cleaned up.
  # Nothing publishes unless the repository variable RELEASE_ENABLED is set to
  # 'true' (Settings > Secrets and variables > Actions > Variables).
  #
  # TODO: once the open PR backlog is merged or closed and main is known good,
  # remove this `gate` job and the `needs: gate` on `publish` below, then drop
  # the RELEASE_ENABLED variable. Until then, flipping the variable to 'true' is
  # the escape hatch for a one-off release — no code change needed.
  gate:
    name: Check releases are enabled
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless RELEASE_ENABLED is true
        if: vars.RELEASE_ENABLED != 'true'
        run: |
          echo "::error::Releases are blocked. Set repository variable RELEASE_ENABLED=true to publish."
          exit 1

  publish:
    name: Build and publish to PyPI
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dataiku-headless
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Derive version from tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Stable vX.Y.Z only; reject pre-release (.preN etc.) tags outright.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a stable vX.Y.Z release tag"
            exit 1
          fi
          version="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing release ${version} (tag ${TAG})"
      - name: Stamp pyproject version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          patched, n = re.subn(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
          if n != 1:
              raise SystemExit(f"expected exactly one [project].version line, patched {n}")
          path.write_text(patched)
          print(f"Set pyproject version to {version}")
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          # No repository-url: defaults to PyPI (https://upload.pypi.org/legacy/).
          # Don't fail the run if this version was already uploaded.
          skip-existing: true
          # Trusted Publishing (OIDC) is used by default — no token needed.
          # To use an API token instead, set the secret and uncomment:
          # password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated release of dataiku-headless ${VERSION} to PyPI."
          fi
