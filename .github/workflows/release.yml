name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Run lint
        run: uv run ruff check .

      - name: Check skill integrity
        run: |
          uv run python scripts/check_skill_links.py
          uv run python scripts/check_skill_tool_names.py

      - name: Build
        run: uv build

      - name: Verify wheel version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/dataiku_headless-*.whl | head -1)
          WHEEL_VERSION=$(echo "$WHEEL" | sed 's/.*dataiku_headless-\(.*\)-py3-none-any\.whl/\1/')
          if [ "$TAG_VERSION" != "$WHEEL_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION wheel=$WHEEL_VERSION"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
          make_latest: true
