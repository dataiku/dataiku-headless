name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the full declared support window on every PR so a regression
        # on an intermediate interpreter cannot slip through.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q

  coverage-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q --cov=dku_cli --cov-report=term-missing --cov-fail-under=70
      - run: uv build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  quality-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python scripts/check_quality_ratchet.py

  security:
    runs-on: ubuntu-latest
    name: Dependency Audit & Secret Scan
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks needs full history to scan every commit on the branch.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Export locked dependencies
        run: uv export --locked --no-emit-project --no-dev -o requirements-audit.txt
      - name: Audit dependencies
        run: uvx pip-audit --strict --requirement requirements-audit.txt
      - name: Resolve secret scan range
        id: secret-range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "log_opts=HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=${{ github.event.before }}..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --log-opts="${{ steps.secret-range.outputs.log_opts }}" \
            --redact \
            --no-banner

  wheel-freshness:
    runs-on: ubuntu-latest
    name: Bundled Wheel Freshness
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Rebuild bundled MCP plugin wheel
        run: make plugin
      - name: Fail if the committed wheel is stale
        run: git diff --exit-code dataiku-mcp/wheels/

  actionlint:
    runs-on: ubuntu-latest
    name: Workflow Lint
    steps:
      - uses: actions/checkout@v6
      - name: Download actionlint
        id: actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Lint all workflows
        run: ${{ steps.actionlint.outputs.executable }} -color -shellcheck=
        shell: bash
