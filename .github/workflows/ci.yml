name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - run: uv run --python "${{ matrix.python-version }}" dku --help >/dev/null
      - run: uv run --python "${{ matrix.python-version }}" pytest -q -n auto

  coverage-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q -n auto --cov=dku_cli --cov-report=term-missing --cov-fail-under=70
      - run: uv build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  quality-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python scripts/check_quality_ratchet.py
      - run: uv run python scripts/check_skill_links.py
      - name: Fetch PR base for baseline diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: uv run python scripts/check_quality_ratchet.py --check-baseline-diff
        if: github.event_name == 'pull_request'
        env:
          QUALITY_RATCHET_BASE_REF: FETCH_HEAD

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Dependency Audit & Secret Scan
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs full history to scan every commit on the branch.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Export locked dependencies
        run: uv export --locked --no-emit-project --no-dev --output-file requirements-audit.txt >/dev/null
      - name: Audit dependencies
        run: uvx pip-audit --strict --no-deps --disable-pip --requirement requirements-audit.txt
      - name: Resolve secret scan range
        id: secret-range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "log_opts=HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=${{ github.event.before }}..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --log-opts="${{ steps.secret-range.outputs.log_opts }}" \
            --redact \
            --no-banner

  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Commit Lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint PR commits
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint PR title (squash-merge subject)
        run: echo "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Workflow Lint
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Lint all workflows
        run: ${{ steps.actionlint.outputs.executable }} -color -shellcheck=
        shell: bash
