name: Feature proposal
description: Suggest an improvement to the plugin, skills, or documentation.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting a proposal. Do not include
        customer data or details copied from a real Dataiku environment.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skills or documentation
        - MCP tools
        - Cobuild
        - Installation or packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the outcome or behavior you would like.
    validations:
      required: true
