name: Bug report
description: Report behavior that is incorrect or unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, instance URLs, or identifiers
        copied from a real Dataiku environment.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: >-
        Provide the smallest reproducible example. Include relevant tool names,
        inputs, and steps when applicable.
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: The release version or commit SHA you were running.
      placeholder: v0.2.0
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      description: Where you were running the plugin.
      options:
        - Codex
        - Claude Code
        - Cursor
        - Snowflake CoCo (Cortex Code)
        - Other or not applicable
    validations:
      required: true

  - type: input
    id: dss_version
    attributes:
      label: Dataiku version
      description: The Dataiku version, if the problem involved an instance.
      placeholder: "15.0 or not applicable"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your operating system and uv version, if relevant.
      placeholder: macOS 15.3, uv 0.12.4
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: >-
        Add relevant stderr, error output, or the smallest useful transcript
        excerpt. Remove secrets and customer data before submitting.
      render: text
    validations:
      required: false
